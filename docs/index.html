      if (overlay) overlay.classList.add('hidden');
      if (progressOverflow !== null) {
        document.body.style.overflow = progressOverflow;
        progressOverflow = null;
      }
    }

    function uploadPhoto(file) {
      if (!file || state.photoBusy) return;
      state.photoBusy = true;
      byId('take-photo').disabled = true;
      showUploadProgress();
      setNotice('photos-notice', 'Uploading photo ' + (state.photos.length + 1) + '\u2026');

      positionFix().then(function (fix) {
        state.fix = fix;
        var form = new FormData();
        form.append('photo', file, file.name || 'photo.jpg');
        form.append('captured_at', isoNow());
        form.append('latitude', fix.latitude);
        form.append('longitude', fix.longitude);
        return postForm(UPLOAD_API + 'photos', form);
      }).then(function (result) {
        state.photoBusy = false;
        hideUploadProgress();
        byId('take-photo').disabled = false;
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status) {
          var movedStage = syncStage(body);
          if (movedStage) { setNotice('photos-notice', movedStage, true); return; }
          setNotice('photos-notice', body.errorMessage || 'Could not upload the photo. Try again.', true);
          return;
        }
        var data = body.data || {};
        var url = (window.URL && window.URL.createObjectURL) ? window.URL.createObjectURL(file) : '';
        if (url) objectUrls.push(url);
        state.photos.push({ photo_id: data.photo_id, url: url });
        if (data.min_required) state.minPhotos = data.min_required;
        setNotice('photos-notice', null);
        renderShots();
        if (data.completed || data.stage === 'completed') applyStage('completed');
      }).catch(function () {
        state.photoBusy = false;
        hideUploadProgress();
        byId('take-photo').disabled = false;
        setNotice('photos-notice', 'Could not upload the photo. Check your connection and try again.', true);
      });
    }

    /* T7: the job closes once the required photos are in. A backend that closes the job on the last photo answers
       the upload with `completed`, and then this button never appears. */
    function completeJob() {
      if (state.posting || state.photoBusy) return;
      state.posting = true;
      var button = byId('complete');
      button.disabled = true;
      setNotice('photos-notice', 'Completing the job\u2026');
      postJson(API + 'complete', {}).then(function (result) {
        state.posting = false;
        arrivalBusy(false);
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (result.ok && body.status) {
          setNotice('photos-notice', null);
          applyStage((body.data || {}).stage || 'completed');
          return;
        }
        if (body.error === 'photos_missing') {
          var data = body.data || {};
          if (data.min_required) state.minPhotos = data.min_required;
          renderShots();
          setNotice('photos-notice', 'Upload all ' + (data.min_required || state.minPhotos) +
            ' photos before completing the job.', true);
          return;
        }
        var moved = syncStage(body);
        if (moved) { setNotice('photos-notice', moved, true); return; }
        setNotice('photos-notice', body.errorMessage || 'Could not complete the job. Try again.', true);
      }).catch(function () {
        state.posting = false;
        button.disabled = false;
        setNotice('photos-notice', 'Could not complete the job. Check your connection and try again.', true);
      });
    }

    /* Retake: allowed only while the job is still working (never after it has completed). */
    function retakePhoto(index) {
      var shot = state.photos[index];
      if (!shot || !shot.photo_id || state.photoBusy || state.stage !== 'working') return;
      if (destroyed) return;
      state.photoBusy = true;
      fetch(API + 'photos/' + encodeURIComponent(shot.photo_id), {
        method: 'DELETE',
        headers: authHeaders({ 'Accept': 'application/json' }),
        credentials: 'same-origin'
      }).then(readJson).then(function (result) {
        state.photoBusy = false;
        var body = result.body || {};
        if (!result.ok || !body.status) {
          setNotice('photos-notice', body.errorMessage || 'Could not remove that photo.', true);
          return;
        }
        state.photos.splice(index, 1);
        setNotice('photos-notice', null);
        renderShots();
      }).catch(function () {
        state.photoBusy = false;
        setNotice('photos-notice', 'Could not remove that photo. Try again.', true);
      });
    }

    function stopCameraWhenHidden() { if (document.hidden) closeCamera(); }

    function startPage() {
      if (!demo && !jobToken && !jobId) {
        showError('Use the link WhatsApp sent you, or ask the ops team for a fresh link.');
        return;
      }
  
      byId('start-trip').addEventListener('click', startTrip);
      byId('allow-location').addEventListener('click', askLocation);
      byId('reload-page').addEventListener('click', function () { window.location.reload(); });
      byId('otp-submit').addEventListener('click', submitOtp);
      byId('otp-input').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') submitOtp();
      });
      byId('reached').addEventListener('click', markReached);
      byId('peek-reached').addEventListener('click', markReached);
      byId('complete').addEventListener('click', completeJob);
      byId('take-photo').addEventListener('click', takePhoto);
      byId('camera-shutter').addEventListener('click', capturePhoto);
      byId('camera-cancel').addEventListener('click', closeCamera);
      byId('camera').addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        event.target.value = '';
        uploadPhoto(file);
      });
      byId('copy-address').addEventListener('click', copyAddress);
      bindSheet();
      /* safety stop: a camera must never stay on once the page is hidden or leaves */
      document.addEventListener('visibilitychange', stopCameraWhenHidden);
      addWindowListener('pagehide', closeCamera);
      /* wake lock, GPS health and an immediate catch-up post when the page comes back to the front */
      document.addEventListener('visibilitychange', onVisibility);
      if (!demo) gpsTimer = setInterval(checkGps, 5000);
      if (!G && !demo) {
        setNotice('trip-notice', mapsKey
          ? 'The map could not be loaded. The trip, arrival and location sharing still work.'
          : 'The map is not set up for this page. The trip, arrival and location sharing still work.', true);
      }
  
      if (demo) {
        state.detail = JSON.parse(JSON.stringify(DEMO_DETAIL));
        if (demoMock === 'bad-car') {
          var badCar = JSON.parse(JSON.stringify(DEMO_BAD_CAR));
          state.detail.car = badCar.car;
          state.detail.services = badCar.services;
          state.detail.customer = badCar.customer;
        }
        renderDetails(state.detail);
        applyStage('assigning');
        hide('loading');
        show('assigning-body');
        if (demoStage === 'trip') {
          state.fix = DEMO_FIX;
          state.route = DEMO_ROUTE;
          state.eta = 6;
          applyStage('on_the_way');
          showTrip();
        }
        return;
      }

      /* Ask for location now, alongside the job fetch (also on a mid-trip reload), so the technician has already
         answered by the time they reach Start Trip. Neither call can block rendering or fail the fetch below. */
      watchPermission();
      renderLocationGate();
      askLocation();

      var jobUrl = API + 'job' +(jobId && !jobToken ? '?job_id=' + encodeURIComponent(jobId) : '');
      getJson(jobUrl).then(function (result) {
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status || !body.data) {
          showError(body.errorMessage || 'Ask the ops team for a fresh link.');
          return;
        }
        state.detail = body.data;
        state.interval = state.detail.location_interval_sec || 15;
        renderDetails(state.detail);
        applyStage(state.detail.stage || 'assigning');
        hide('loading');
        simResume();   /* Simulate drive: restore the switch after a reload (no-op unless it was on) */
        if ((state.detail.stage || 'assigning') === 'assigning') {
          show('assigning-body');
          return;
        }
        // Reloaded mid-trip (or the job moved on): go straight back to the map and let the location poll rebuild the
        // ETA instead of offering Start Trip again. The route comes back from storage (or the job payload, if the
        // backend sends it); only when neither has it does ensureRoute() fetch one from the first fix.
        if (DRIVING_STAGES[state.stage] && (!state.route || state.route.length < 2)) {
          var keptRoute = loadRoute() || (typeof state.detail.route_polyline === 'string' ? state.detail.route_polyline : '');
          var keptPoints = keptRoute ? decodePolyline(keptRoute) : [];
          /* drawn at once; the first position then trims it to the part still ahead (moveTech -> updateRouteProgress) */
          if (keptPoints.length >= 2) state.route = keptPoints;
        }
        showTrip();
        if (DRIVING_STAGES[state.stage]) { watchPosition(); schedulePoll(); }
        if (state.stage === 'working' || state.stage === 'completed') setSheet(true);
      }).catch(function () {
        showError('Could not load the job. Check your connection and reload.');
      });
    }

    /* ---------------- Google Maps JavaScript API (first boot only) ---------------- */

    /* Load the Maps JavaScript API once, then start the page. A missing key, a blocked script or a slow network never
       blocks the job: after MAPS_LOAD_TIMEOUT_MS (or on error) the page starts without a map. */
    function withGoogleMaps(done) {
      var finished = false;
      function settle() {
        if (finished || destroyed) return;
        finished = true;
        G = (window.google && window.google.maps && window.google.maps.Map) ? window.google.maps : null;
        done();
      }
      /* Google calls this when the key is rejected (wrong key, API not enabled, referrer not allowed). */
      window.gm_authFailure = function () {
        if (destroyed) return;
        setNotice('trip-notice', 'The map could not be loaded (map key rejected). The trip, arrival and location sharing still work.', true);
        if (typeof previousAuthFailure === 'function') previousAuthFailure();
      };
      if (window.google && window.google.maps && window.google.maps.Map) { settle(); return; }
      if (!mapsKey) { settle(); return; }
      var timer = setTimeout(settle, MAPS_LOAD_TIMEOUT_MS);
      window[MAPS_CALLBACK] = function () { clearTimeout(timer); settle(); };
      var script = document.createElement('script');
      script.src = GOOGLE_MAPS_JS + '?key=' + encodeURIComponent(mapsKey) + '&v=weekly&callback=' + MAPS_CALLBACK;
      script.async = true;
      script.onerror = function () { clearTimeout(timer); settle(); };
      injected.push(script);
      document.head.appendChild(script);
    }

    simBuildUi();   /* Simulate drive switch (testing only; renders nothing when SHOW_TEST_SWITCH is false) */
    withGoogleMaps(startPage);

    return function teardown() {
      if (destroyed) return;
      destroyed = true;
      closeCamera();
      document.removeEventListener('visibilitychange', stopCameraWhenHidden);
      document.removeEventListener('visibilitychange', onVisibility);
      if (gpsTimer) { clearInterval(gpsTimer); gpsTimer = null; }
      if (wakeLock) { var held = wakeLock; wakeLock = null; held.release().catch(noop); }
      if (markerAnimation) { cancelAnimationFrame(markerAnimation); markerAnimation = null; }
      window.gm_authFailure = previousAuthFailure;
      try { delete window[MAPS_CALLBACK]; } catch (error) { window[MAPS_CALLBACK] = undefined; }
      if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
      stopWatch();
      simHalt();
      if (permissionStatus) { permissionStatus.onchange = null; permissionStatus = null; }
      windowListeners.forEach(function (entry) { window.removeEventListener(entry[0], entry[1]); });
      windowListeners = [];
      if (headerObserver) { headerObserver.disconnect(); headerObserver = null; }
      if (map) {
        try {
          mapListeners.forEach(function (listener) { listener.remove(); });
          clearRouteLines();
          [techMarker, pinMarker, accuracyCircle, trafficLayer].forEach(function (item) { if (item) item.setMap(null); });
          G.event.clearInstanceListeners(map);
        } catch (error) { /* already gone */ }
        mapListeners = []; map = null; techMarker = null; pinMarker = null; accuracyCircle = null; trafficLayer = null;
        followButton = null;
      }
      objectUrls.forEach(function (url) { try { window.URL.revokeObjectURL(url); } catch (error) { /* ignore */ } });
      objectUrls = [];
      injected.forEach(function (node) { if (node.parentNode) node.parentNode.removeChild(node); });
      injected = [];
      /* Fresh markup also drops every element listener bound by startPage(). */
      root.innerHTML = initialMarkup;
      document.body.style.overflow = previousOverflow;
      started = false;
    };
}

/* Standalone entry: replaces the website's React route (index.js / RsaTechnicianJob.js).
   Everything the page needs comes from the URL or from window.RSA_CONFIG (see config.json):

     ?job=<jobToken>          the technician link token (also accepted: ?token=)
     &api=<url>               main API base, e.g. https://abc.ngrok-free.app/api/
     &upload_api=<url>        photo-upload API base (defaults to &api=)
     &maps_key=<key>          Google Maps browser key (Maps JavaScript API); without it there is no map
     &routes_key=<key>        Routes API key for the Start-trip route (defaults to &maps_key=)
     &ngrok=0                 do not add the ngrok-skip-browser-warning header
     ?demo=1                  boot.js demo mode: no API calls, sample data

   `markup`, `css` and `boot` are defined above this block by build.js. */

var cfg = window.RSA_CONFIG || {};
var query = new URLSearchParams(window.location.search);
var allowQuery = cfg.allowQueryApi !== false;

function pick(name, fallback) {
  var fromUrl = allowQuery ? (query.get(name) || '').trim() : '';
  return fromUrl || String(fallback || '').trim();
}

var jobToken = (query.get('job') || query.get('token') || cfg.jobToken || '').trim();
var apiBase = pick('api', cfg.apiBase);
var uploadApiBase = pick('upload_api', cfg.uploadApiBase) || apiBase;
var googleMapsKey = pick('maps_key', cfg.googleMapsKey);
var googleRoutesKey = pick('routes_key', cfg.googleRoutesKey);
var isDemo = query.get('demo') === '1';

/* ngrok's free tier answers browser requests with an HTML warning page unless this header is present.
   Added only for ngrok hosts. NOTE: the backend's CORS must list `ngrok-skip-browser-warning` in
   Access-Control-Allow-Headers, otherwise the browser blocks the call; use &ngrok=0 to turn this off. */
var ngrokHeader = query.get('ngrok') !== '0' && cfg.ngrokSkipWarning !== false;
var nativeFetch = window.fetch.bind(window);
window.fetch = function (url, init) {
  try {
    var target = typeof url === 'string' ? url : (url && url.url) || '';
    if (ngrokHeader && /ngrok/i.test(target)) {
      init = Object.assign({}, init);
      init.headers = Object.assign({}, init.headers, { 'ngrok-skip-browser-warning': '1' });
    }
  } catch (error) { /* fall through to a plain fetch */ }
  return nativeFetch(url, init);
};

function showSetupProblem(message) {
  var root = document.getElementById('rsa-job');
  root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:520px;margin:48px auto;padding:20px;' +
    'border:1px solid #f5c2c7;background:#fff5f5;color:#842029;border-radius:10px;line-height:1.5">' +
    '<strong>Page not set up</strong><br>' + message + '</div>';
}

function start() {
  var style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);

  var root = document.getElementById('rsa-job');
  if (!isDemo && !apiBase) {
    showSetupProblem('No API address. Open this page as <code>?job=&lt;token&gt;&amp;api=https://your-api-host/api/</code> ' +
      'or set <code>apiBase</code> in config.json and rebuild.');
    return;
  }
  if (!isDemo && !jobToken) {
    showSetupProblem('No job token. Open this page as <code>?job=&lt;token&gt;&amp;api=...</code>.');
    return;
  }
  root.innerHTML = markup;
  boot({ jobToken: jobToken, apiBase: apiBase, uploadApiBase: uploadApiBase, googleMapsKey: googleMapsKey, googleRoutesKey: googleRoutesKey });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();

})();
</script>
</body>
</html>

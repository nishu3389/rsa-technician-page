      if (!name && reg) {

        var looksLikePlate = /^[A-Z]{2}\d{1,2}[A-Z]{0,3}\d{3,4}$/.test(reg.replace(/\s+/g, ''));
        if (m && !looksLikePlate) {

    /* Google encoded polyline, precision 5 - the format the route is sent and drawn in. */
    function decodePolyline(encoded) {

      while (encoded && index < encoded.length) {
        var shift = 0, result = 0, byte;
        do { byte = encoded.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20 && index <= encoded.length);

        do { byte = encoded.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20 && index <= encoded.length);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        points.push([lat / 1e5, lng / 1e5]);

    /* The page draws the trip route once at Start (T2); the backend stores it and serves it to the customer. */

    function haversineM(a, b) {
      var rad = Math.PI / 180;
      var dLat = (b.latitude - a.latitude) * rad;
      var dLon = (b.longitude - a.longitude) * rad;
      var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(a.latitude * rad) * Math.cos(b.latitude * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(h)));

    /* Show the arrival action only while unlocked; locked shows one distance line instead. Unknown distance never locks. */
    function renderGate() {

      byId('peek-reached').classList.toggle('hidden', !arriving || lockedNow);

      updateGate();
      if (OTP_STAGES[stage]) setSheet(true);            /* the OTP is the next action: show it, do not make them hunt */
      byId('otp-block').classList.toggle('hidden', !OTP_STAGES[stage]);
      byId('photos-block').classList.toggle('hidden', !PHOTO_STAGES[stage]);
      byId('done-block').classList.toggle('hidden', stage !== 'completed' && stage !== 'cancelled');
      if (stage === 'completed' || stage === 'cancelled') {
        byId('done-line').textContent = stage === 'completed'
          ? ('Job completed \u00b7 ' + state.photos.length + ' photo' + (state.photos.length === 1 ? '' : 's') + ' uploaded')
          : 'Job cancelled by support';

          ? 'The invoice has been generated. Nothing else is needed from you.'
          : 'Nothing else is needed from you. Support will follow up.');

        setSheet(true);
      }

    }

    /* "450 m" below a kilometre (to the nearest 10 m), "1.2 km" from a kilometre up. */
    function formatDistance(metres) {
      if (metres >= 1000) return (Math.round(metres / 100) / 10) + ' km';
      return metres < 10 ? '<10 m' : (Math.round(metres / 10) * 10) + ' m';
    }

    /* Straight-line distance left to the customer (state.away), only while still driving to them; '' when unknown. */
    function awayText() {
      if (!ARRIVAL_STAGES[state.stage]) return '';
      return (typeof state.away === 'number' && isFinite(state.away)) ? formatDistance(state.away) : '';
    }

    function renderEta() {
      var stageLabel = STAGE_LABELS[state.stage] || '';
      var dist = awayText();
      var label = stageLabel;
      if (state.stage === 'reached') label = 'At the customer';
      else if (DRIVING_STAGES[state.stage]) {
        if (state.eta) label = 'Arriving in ' + state.eta + ' min' + (dist ? ' \u00b7 ' + dist : '');

      var how = state.eta ? (state.eta + ' min' + (dist ? ' \u00b7 ' + dist : '') + ' away') : (dist ? dist + ' away' : '');
      byId('peek-what').textContent = how ? (how + ' \u00b7 ' + stageLabel) : stageLabel;
    }

    /* ---------------- map ---------------- */

    var map = null, routeLayer = null, techMarker = null, pinMarker = null;

    function buildMap() {
      if (!L) return;   /* Leaflet could not be loaded: the trip sheet still works without the map */
      var location = (state.detail && state.detail.customer_location) || {};
      var pin = [location.latitude, location.longitude];
      if (!map) {
        map = L.map('map', { zoomControl: false }).setView(pin, 14);
        /* OpenStreetMap tiles need no key; the CARTO basemap now answers "API KEY REQUIRED" placeholders. */
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        setTimeout(function () { if (map) map.invalidateSize(); }, 60);
      }
      var pinIcon = L.divIcon({
        className: '',
        html: '<div style="width:18px;height:18px;border-radius:50%;background:#101820;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)"></div>',
        iconSize: [18, 18], iconAnchor: [9, 9]
      });
      if (pinMarker) { pinMarker.setLatLng(pin); } else { pinMarker = L.marker(pin, { icon: pinIcon }).addTo(map); }
      drawRouteLine();
      frameMap();
    }

    function drawRouteLine() {
      if (!map) return;
      if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
      if ((!state.route || state.route.length < 2) && state.fix && pinMarker) {
        // No route yet (reloaded mid-trip, or the route was refused): a dashed line beats an empty map.
        routeLayer = L.polyline([pinMarker.getLatLng(), L.latLng(state.fix.latitude, state.fix.longitude)],
          { color: '#9aa4ae', weight: 3, dashArray: '6 8' }).addTo(map);
        return;
      }
      if (!state.route || state.route.length < 2) return;
      routeLayer = L.layerGroup([
        L.polyline(state.route, { color: '#ffffff', weight: 9, opacity: .9 }),
        L.polyline(state.route, { color: '#f9c22e', weight: 5 })
      ]).addTo(map);
    }

    function frameMap() {
      if (!map) return;
      var points = [];
      if (pinMarker) points.push(pinMarker.getLatLng());
      if (techMarker) points.push(techMarker.getLatLng());
      state.route.forEach(function (point) { points.push(L.latLng(point[0], point[1])); });
      if (!points.length) return;
      map.fitBounds(L.latLngBounds(points), { paddingTopLeft: [40, 130], paddingBottomRight: [40, 40] });
    }

    function moveTech() {
      if (!map || !state.fix) return;
      var at = [state.fix.latitude, state.fix.longitude];
      if (techMarker) { techMarker.setLatLng(at); return; }
      var icon = L.divIcon({
        className: '',
        html: '<div style="width:20px;height:20px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.45)"></div>',
        iconSize: [20, 20], iconAnchor: [10, 10]
      });
      techMarker = L.marker(at, { icon: icon }).addTo(map);
    }

    /* ---------------- bottom sheet: grab handle, two resting heights ---------------- */

    var PEEK_OFFSET = 0.62;
    var sheet = byId('sheet');
    var dragStartY = null, dragStartOffset = null, sheetOpen = false;

    function sheetHeight() { return sheet.offsetHeight || window.innerHeight * 0.9; }

    function setSheet(open) {
      sheetOpen = open;
      sheet.classList.toggle('open', open);
      sheet.style.setProperty('--peek', open ? '0px' : Math.round(sheetHeight() * PEEK_OFFSET) + 'px');
    }

    function currentOffset() {
      var transform = getComputedStyle(sheet).transform;
      if (!transform || transform === 'none') return 0;
      var match = transform.match(/matrix\(([^)]+)\)/);
      return match ? parseFloat(match[1].split(',')[5]) : 0;
    }

    function bindSheet() {
      var handle = byId('sheet-grab');
      var peek = byId('sheet-peek');

      function start(event) {
        var point = event.touches ? event.touches[0] : event;
        dragStartY = point.clientY;
        dragStartOffset = currentOffset();
        sheet.classList.add('dragging');
      }
      function move(event) {
        if (dragStartY === null) return;
        var point = event.touches ? event.touches[0] : event;
        var next = dragStartOffset + (point.clientY - dragStartY);
        var max = sheetHeight() * PEEK_OFFSET;
        sheet.style.setProperty('--peek', Math.min(Math.max(next, 0), max) + 'px');
        if (event.cancelable) event.preventDefault();
      }
      function end() {
        if (dragStartY === null) return;
        var offset = currentOffset();
        sheet.classList.remove('dragging');
        dragStartY = null;
        setSheet(offset < sheetHeight() * PEEK_OFFSET / 2);
      }

      [handle, peek].forEach(function (element) {
        element.addEventListener('touchstart', start, { passive: true });
        element.addEventListener('touchmove', move, { passive: false });
        element.addEventListener('touchend', end);
        element.addEventListener('mousedown', start);
      });
      addWindowListener('mousemove', move);
      addWindowListener('mouseup', end);
      handle.addEventListener('click', function () { setSheet(!sheetOpen); });
    }

    /* ---------------- journey ---------------- */

    function showTrip() {
      byId('view-assigning').style.display = 'none';
      byId('view-trip').style.display = 'block';
      buildMap();
      moveTech();
      frameMap();
      setSheet(false);
    }

    function startTrip() {
      if (state.posting) return;
      if (!demo && state.permApi && state.permission !== 'granted') { renderLocationGate(); return; }
      if (demo) {
        state.fix = DEMO_FIX;
        state.route = DEMO_ROUTE;
        state.eta = 6;
        applyStage('on_the_way');
        showTrip();
        return;
      }
      state.posting = true;
      syncStartButton();
      setNotice('start-notice', 'Getting your location\u2026');

      positionFix().then(function (fix) {
        state.fix = fix;
        return drawRoute(fix, (state.detail || {}).customer_location).then(function (route) {
          var payload = {
            latitude: fix.latitude,
            longitude: fix.longitude,
            recorded_at: isoNow()
          };
          if (route) {
            payload.route_polyline = route.route_polyline;
            payload.route_distance_meters = route.route_distance_meters;
            payload.route_duration_minutes = route.route_duration_minutes;
            payload.route_computed_at = route.route_computed_at;
            state.route = decodePolyline(route.route_polyline);
            state.routeAt = Date.now();
          }
          return postJson(API + 'start_journey', payload);
        });
      }).then(function (result) {
        state.posting = false;
        arrivalBusy(false);
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status) {
          setNotice('start-notice', body.errorMessage || 'Could not start the trip. Try again.', true);
          return;
        }
        var data = body.data || {};
        state.eta = typeof data.eta_minutes === 'number' ? data.eta_minutes : null;
        if (data.next_interval_sec) state.interval = data.next_interval_sec;
        else if (state.detail && state.detail.location_interval_sec) state.interval = state.detail.location_interval_sec;
        applyStage(data.stage || 'on_the_way');
        setNotice('start-notice', null);
        showTrip();
        /* route_source is 'technician' or 'backend'; a rejected route never blocks the trip and the map keeps ours. */
        setNotice('trip-notice', data.route_accepted === false
          ? 'Your route could not be used, so the backend drew its own.' : null);
        watchPosition();
        state.lastPostAt = Date.now();
        schedulePoll();
      }).catch(function (error) {
        state.posting = false;
        syncStartButton();
        renderLocationGate();
        setNotice('start-notice', error && error.code === 1
          ? 'Location permission is needed to start the trip. Use the location banner at the top of this page to allow it.'
          : 'Could not start the trip. Check your connection and try again.', true);
      });
    }

    function watchPosition() {
      if (demo || sim.on) return;
      if (!navigator.geolocation || state.watchId !== null) return;
      state.watchId = navigator.geolocation.watchPosition(function (position) {
        setFix({
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy
        });
        moveTech();
      }, function () { /* the next poll keeps the last fix */ },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    }

    function schedulePoll() {
      if (demo) return;
      if (sim.on) { simDrive(); return; }   /* Simulate drive: the virtual driver posts, not the real poll */
      var seconds = state.interval || 15;
      state.pollTimer = setTimeout(function () { sendLocation().then(schedulePoll); }, seconds * 1000);
    }

    /* T3: positions only (max 20 points). The route is drawn once at Start (T2) and is never sent here. */
    function sendLocation() {
      if (!DRIVING_STAGES[state.stage]) return Promise.resolve();
      if (!state.fix) return Promise.resolve();

      state.buffer.push({
        latitude: state.fix.latitude,
        longitude: state.fix.longitude,
        accuracy_m: Math.round(state.fix.accuracy || 0),
        recorded_at: isoNow()
      });
      if (state.buffer.length > 20) state.buffer = state.buffer.slice(-20);

      var payload = { points: state.buffer.slice(-20) };

      return postJson(API + 'location', payload).then(function (result) {
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status) return;
        var data = body.data || {};
        if (data.accepted === false) { stopPolling(); applyStage(data.stage || state.stage); return; }
        state.buffer = [];
        state.lastPostAt = Date.now();
        if (typeof data.eta_minutes === 'number') state.eta = data.eta_minutes;
        if (data.next_interval_sec) state.interval = data.next_interval_sec;
        if (data.stage) applyStage(data.stage);
      }).catch(function () { /* buffered points go out on the next tick */ });
    }

    function stopWatch() {
      if (state.watchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(state.watchId);
        state.watchId = null;
      }
    }

    function stopPolling() {
      if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
      stopWatch();
      simHalt();
    }

    /* ================= Simulate drive (TESTING ONLY; everything is behind SHOW_TEST_SWITCH) =================
       Turning the switch ON replaces the technician's GPS with a virtual one: it starts at SIM_START (Sector 49, Gurgaon),
       draws the route to the customer pin with the page's own drawRoute(), calls T2 (start_journey) unless the job is
       already past Start, then walks the route at SIM_SPEED_KMH, posting T3 (location, reason "stream") every
       location_interval_sec, until it is within SIM_ARRIVE_M of the pin. It never calls T5 or anything after it.
       Turning it OFF stops the timer and goes back to real GPS; the trip is left as it is on the server. */

    function simKey() { return SIM_STORAGE_KEY + ':' + (jobToken || jobId || ''); }

    function simSave() {
      try {
        if (sim.on && sim.fix) {
          window.sessionStorage.setItem(simKey(), JSON.stringify({ on: true, latitude: sim.fix.latitude, longitude: sim.fix.longitude }));
        } else {
          window.sessionStorage.removeItem(simKey());
        }
      } catch (error) { /* storage can be blocked: the switch just will not survive a reload */ }
    }

    function simLoad() {
      try {
        var raw = window.sessionStorage.getItem(simKey());
        return raw ? JSON.parse(raw) : null;
      } catch (error) { return null; }
    }

    function simPin() {
      var at = (state.detail && state.detail.customer_location) || {};
      if (at.latitude === null || at.latitude === undefined || at.latitude === '' ||
          at.longitude === null || at.longitude === undefined || at.longitude === '') return null;
      var lat = Number(at.latitude), lng = Number(at.longitude);
      return (isFinite(lat) && isFinite(lng)) ? { latitude: lat, longitude: lng } : null;
    }

    function simRender() {
      if (sim.toggle) sim.toggle.checked = sim.on;
      if (sim.badge) sim.badge.style.display = sim.on ? 'block' : 'none';
    }

    function simHalt() {
      if (sim.timer) { clearInterval(sim.timer); sim.timer = null; }
    }

    /* Route as a list of [lat, lng] with cumulative metres, so the driver can be placed by distance. */
    function simSetRoute(points) {
      sim.pts = points;
      sim.cum = [0];
      for (var i = 1; i < points.length; i += 1) {
        sim.cum.push(sim.cum[i - 1] + haversineM(
          { latitude: points[i - 1][0], longitude: points[i - 1][1] },
          { latitude: points[i][0], longitude: points[i][1] }));
      }
      sim.total = sim.cum[sim.cum.length - 1] || 0;
      sim.dist = 0;
      sim.ready = points.length >= 2 && sim.total > 0;
    }

    /* Distance along the route of the point nearest `from` (a reload resumes from there, not from the route's start). */
    function simNearest(from) {
      var best = 0, bestD = Infinity, k = Math.cos(from.latitude * Math.PI / 180);
      var px = from.longitude * k, py = from.latitude;
      for (var i = 1; i < sim.pts.length; i += 1) {
        var ax = sim.pts[i - 1][1] * k, ay = sim.pts[i - 1][0], bx = sim.pts[i][1] * k, by = sim.pts[i][0];
        var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
        var t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
        t = Math.max(0, Math.min(1, t));
        var cx = ax + dx * t, cy = ay + dy * t;
        var d = (px - cx) * (px - cx) + (py - cy) * (py - cy);
        if (d < bestD) { bestD = d; best = sim.cum[i - 1] + (sim.cum[i] - sim.cum[i - 1]) * t; }
      }
      return best;
    }

    /* Interpolates between polyline vertices (no vertex-to-vertex jumps). */
    function simPointAt(distance) {
      var pts = sim.pts, cum = sim.cum;
      if (distance <= 0) return pts[0];
      if (distance >= sim.total) return pts[pts.length - 1];
      var i = 1;
      while (i < cum.length - 1 && cum[i] < distance) i += 1;
      var seg = cum[i] - cum[i - 1];
      var t = seg > 0 ? (distance - cum[i - 1]) / seg : 0;
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
    }

    /* The virtual technician is "the GPS": state.fix drives the page's own gate, distance and map marker. */
    function simSetPosition(lat, lng) {
      sim.fix = { latitude: lat, longitude: lng, accuracy: SIM_ACCURACY_M };
      state.fix = sim.fix;
      state.serverAway = null;
      setPermission('granted');
      updateGate();
      moveTech();
      simSave();
    }

    function simDrawn(from, pin) {
      return drawRoute(from, pin).then(function (route) {
        return { route: route, pts: route ? decodePolyline(route.route_polyline) : [] };
      });
    }

    function simDrive() {
      if (!sim.on || !sim.ready || sim.timer || sim.finished) return;
      sim.lastTick = Date.now();
      sim.lastPostAt = sim.reason === 'reopen' ? 0 : Date.now();   /* a reload posts at once, as "reopen" */
      sim.timer = setInterval(simTick, SIM_TICK_MS);
    }

    function simTick() {
      if (destroyed || !sim.on || !DRIVING_STAGES[state.stage]) { simHalt(); return; }
      var pin = simPin();
      if (!pin) { simHalt(); return; }
      var now = Date.now();
      var interval = (state.interval || 15) * 1000;
      var dt = Math.min(now - sim.lastTick, interval * 2);    /* a throttled background tab must not teleport */
      sim.lastTick = now;
      if (!sim.finishing) {
        sim.dist = Math.min(sim.total, sim.dist + (SIM_SPEED_KMH / 3.6) * (dt / 1000));   /* only ever forward */
        var at = simPointAt(sim.dist);
        simSetPosition(at[0], at[1]);
        if (haversineM(sim.fix, pin) <= SIM_ARRIVE_M || sim.dist >= sim.total) sim.finishing = true;
      }
      if (sim.finishing || now - sim.lastPostAt >= interval) simPost();
    }

    function simPost() {
      if (sim.busy || !sim.fix) return;
      sim.busy = true;
      var run = sim.run;
      sim.pending.push({
        latitude: sim.fix.latitude,
        longitude: sim.fix.longitude,
        accuracy_m: SIM_ACCURACY_M,
        recorded_at: isoNow()
      });
      if (sim.pending.length > 20) sim.pending = sim.pending.slice(-20);
      sim.lastPostAt = Date.now();
      postJson(API + 'location', { points: sim.pending.slice(), reason: sim.reason }).then(function (result) {
        sim.busy = false;
        if (!sim.on || sim.run !== run || destroyed) return;
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status) return;                 /* points stay pending and go out with the next post */
        var data = body.data || {};
        if (data.accepted === false) { simHalt(); sim.finished = true; applyStage(data.stage || state.stage); return; }
        sim.pending = [];
        sim.reason = 'stream';
        if (typeof data.eta_minutes === 'number') state.eta = data.eta_minutes;
        if (data.next_interval_sec) state.interval = data.next_interval_sec;
        if (data.stage && data.stage !== state.stage) applyStage(data.stage); else renderEta();
        if (sim.finishing) { simHalt(); sim.finished = true; }   /* the last point is in: stop the timer */
      }).catch(function () { sim.busy = false; });
    }

    function simTurnOn(resume) {
      if (!SHOW_TEST_SWITCH || sim.on || destroyed) return;
      var pin = simPin();
      var driving = !!DRIVING_STAGES[state.stage];
      var noticeId = state.stage === 'assigning' ? 'start-notice' : 'trip-notice';
      if (!state.detail || !pin) {
        simRender();
        setNotice(noticeId, 'Simulate drive needs the job and the customer location to be loaded.', true);
        return;
      }
      if (state.stage !== 'assigning' && !driving) {
        simRender();
        setNotice(noticeId, 'Simulate drive only works before the technician reaches the customer.', true);
        return;
      }
      sim.on = true;
      sim.run += 1;
      var run = sim.run;
      sim.ready = false; sim.finishing = false; sim.finished = false; sim.busy = false;
      sim.pending = []; sim.dist = 0; sim.pts = []; sim.cum = []; sim.total = 0;
      sim.reason = resume ? 'reopen' : 'stream';
      /* real GPS out: no poll timer, no watch, and (via setFix / currentPosition) no real fixes */
      if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
      stopWatch();

      var startAt = (resume && isFinite(Number(resume.latitude)) && isFinite(Number(resume.longitude)))
        ? { latitude: Number(resume.latitude), longitude: Number(resume.longitude) }
        : { latitude: SIM_START.latitude, longitude: SIM_START.longitude };
      simSetPosition(startAt.latitude, startAt.longitude);   /* the marker jumps there at once (when the map is up) */
      simRender();
      setNotice(noticeId, null);

      function alive() { return sim.on && sim.run === run && !destroyed; }
      function line(from) { return [[from.latitude, from.longitude], [pin.latitude, pin.longitude]]; }
      /* Start driving along `pts` (a straight line when no road route could be had). */
      function begin(pts) {
        if (!alive()) return;
        if (!pts || pts.length < 2) pts = line(startAt);
        simSetRoute(pts);
        if (resume) sim.dist = simNearest(startAt);   /* resume from the route point nearest the last position */
        state.route = pts;
        drawRouteLine();
        simDrive();
      }
      /* The page's own current route, joined to the start point if it begins somewhere else. */
      function pageRoute() {
        var pts = state.route.slice();
        if (haversineM(startAt, { latitude: pts[0][0], longitude: pts[0][1] }) > 50) pts.unshift([startAt.latitude, startAt.longitude]);
        return pts;
      }

      if (driving) {
        /* Already past Start (reload, or the technician tapped Start): no T2, carry on with the route. */
        if (!resume && state.route && state.route.length >= 2) { begin(pageRoute()); return; }
        simDrawn(startAt, pin).then(function (drawn) { begin(drawn.pts); });
        return;
      }

      /* Stage "assigning": draw the route, call T2 with the fixed position, then drive. */
      simDrawn(startAt, pin).then(function (drawn) {
        if (!alive()) return null;
        var payload = { latitude: startAt.latitude, longitude: startAt.longitude, recorded_at: isoNow() };
        if (drawn.route) {
          payload.route_polyline = drawn.route.route_polyline;
          payload.route_distance_meters = drawn.route.route_distance_meters;
          payload.route_duration_minutes = drawn.route.route_duration_minutes;
          payload.route_computed_at = drawn.route.route_computed_at;
        }
        return postJson(API + 'start_journey', payload).then(function (result) {
          if (!alive()) return;
          var end = endOfLink(result.body, result.status);
          if (end) { failLink(end); return; }
          var body = result.body || {};
          var data = body.data || {};
          if (result.status === 409 && body.error === 'invalid_stage') {
            /* Already started (the technician tapped Start first): skip T2 and drive the page's current route. */
            syncStage(body);
            if (!DRIVING_STAGES[state.stage]) { simTurnOff(); return; }
            showTrip();
            begin(state.route && state.route.length >= 2 ? pageRoute() : drawn.pts);
            return;
          }
          if (!result.ok || !body.status) {
            setNotice('start-notice', body.errorMessage || 'Simulate drive could not start the trip.', true);
            return;
          }
          if (drawn.route) { state.route = drawn.pts; state.routeAt = Date.now(); }
          state.eta = typeof data.eta_minutes === 'number' ? data.eta_minutes : null;
          if (data.next_interval_sec) state.interval = data.next_interval_sec;
          else if (state.detail && state.detail.location_interval_sec) state.interval = state.detail.location_interval_sec;
          applyStage(data.stage || 'on_the_way');
          setNotice('start-notice', null);
          showTrip();
          setNotice('trip-notice', data.route_accepted === false
            ? 'Your route could not be used, so the backend drew its own.' : null);
          state.lastPostAt = Date.now();
          begin(drawn.pts);
        });
      }).catch(function () {
        if (alive()) setNotice('start-notice', 'Simulate drive could not reach the server. Turn it off and on to retry.', true);
      });
    }

    function simTurnOff() {
      if (!sim.on) return;
      sim.on = false;
      sim.run += 1;                      /* any request still in flight is ignored when it lands */
      simHalt();
      sim.ready = false; sim.fix = null; sim.pending = [];
      simSave();                         /* clears the stored switch state */
      simRender();
      if (destroyed) return;
      /* Back to the real GPS path (marker, arrival gate and manual steps read the real position again). Nothing is posted
         automatically any more: the real poll is deliberately NOT restarted, or it would move the technician to the
         tester's real location. A reload restores the normal full behaviour. The trip stays as it is on the server. */
      state.fix = null;
      state.serverAway = null;
      updateGate();
      watchPermission();
      if (DRIVING_STAGES[state.stage]) {
        watchPosition();
        setNotice('trip-notice', 'Simulation is off. Location is not being shared until you reload this page.');
      }
      askLocation();
    }

    function simResume() {
      if (!SHOW_TEST_SWITCH || demo || sim.on) return;
      var saved = simLoad();
      if (saved && saved.on) simTurnOn(saved);
    }

    function simBuildUi() {
      if (!SHOW_TEST_SWITCH || demo) return;
      var box = document.createElement('div');
      box.id = 'sim-switch';
      box.setAttribute('style', 'position:fixed;left:10px;bottom:10px;z-index:2000;display:flex;flex-direction:column;' +
        'align-items:flex-start;gap:6px;font:600 12px/1.2 system-ui,-apple-system,sans-serif');
      var badge = document.createElement('div');
      badge.id = 'sim-badge';
      badge.textContent = 'SIMULATED DRIVE';
      badge.setAttribute('style', 'display:none;background:#d93025;color:#fff;letter-spacing:.08em;padding:4px 10px;' +
        'border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.35)');
      var label = document.createElement('label');
      label.setAttribute('style', 'display:flex;align-items:center;gap:8px;background:rgba(24,24,24,.86);color:#fff;' +
        'padding:6px 12px;border-radius:999px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.35)');
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.id = 'sim-toggle';
      input.setAttribute('style', 'margin:0');
      label.appendChild(input);
      label.appendChild(document.createTextNode('Test: simulate drive'));
      box.appendChild(badge);
      box.appendChild(label);
      document.body.appendChild(box);
      injected.push(box);                 /* removed again on teardown */
      sim.toggle = input;
      sim.badge = badge;
      input.addEventListener('change', function () { if (input.checked) simTurnOn(null); else simTurnOff(); });
    }

    /* ---------------- T5: arrival OTP ---------------- */

    function submitOtp() {
      if (state.otpBusy) return;
      var input = byId('otp-input');
      var otp = (input.value || '').replace(/\D/g, '');
      if (otp.length !== 4) {
        setNotice('otp-notice', 'Enter the 4-digit OTP the customer sees in their app.', true);
        return;
      }
      state.otpBusy = true;
      var button = byId('otp-submit');
      button.disabled = true;
      setNotice('otp-notice', 'Checking the OTP\u2026');

      positionFix().then(function (fix) {
        state.fix = fix;
        return postJson(API + 'verify_otp', {
          otp: otp,
          latitude: fix.latitude,
          longitude: fix.longitude,
          recorded_at: isoNow()
        });
      }).then(function (result) {
        state.otpBusy = false;
        button.disabled = false;
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (result.ok && body.status) {
          input.value = '';
          setNotice('otp-notice', null);
          state.buffer = [];
          applyStage((body.data || {}).stage || 'working');
          return;
        }
        var data = body.data || {};
        if (body.error === 'otp_incorrect') {
          input.value = '';
          input.focus();
          setNotice('otp-notice', data.attempts_left !== undefined
            ? 'Wrong OTP. ' + data.attempts_left + ' attempt' + (data.attempts_left === 1 ? '' : 's') + ' left.'
            : (body.errorMessage || 'Wrong OTP. Check with the customer and try again.'), true);
          return;
        }
        if (body.error === 'otp_attempts_exceeded' || result.status === 429) {
          setNotice('otp-notice', 'Too many wrong attempts. Support has been alerted \u2014 call them to restart the visit.', true);
          return;
        }
        if (body.error === 'too_far_from_customer') {
          var away = data.distance_m;
          lockFromServer(away);
          setNotice('otp-notice', 'You look ' + (away ? Math.round(away) + ' m' : 'too far') +
            ' from the customer. Move closer to the car and enter the OTP again.', true);
          return;
        }
        var moved = syncStage(body);
        if (moved) { setNotice('otp-notice', moved, true); return; }
        setNotice('otp-notice', body.errorMessage || 'Could not verify the OTP. Try again.', true);
      }).catch(function (error) {
        state.otpBusy = false;
        button.disabled = false;
        setNotice('otp-notice', error && error.code === 1
          ? 'Location permission is needed to confirm you are at the car. Allow it for this page and try again.'
          : 'Could not verify the OTP. Check your connection and try again.', true);
      });
    }

    /* ---------------- T4: I have reached ---------------- */

    function arrivalBusy(busy) {
      byId('reached').disabled = busy;
      byId('peek-reached').disabled = busy;
    }

    function markReached() {
      if (state.posting) return;
      state.posting = true;
      arrivalBusy(true);
      setNotice('arrive-notice', 'Checking you are at the customer\u2026');

      /* One clean fix at the pin: a high-accuracy watch competing for the GPS is what makes this tap slow. */
      stopWatch();
      positionFix().then(function (fix) {
        state.fix = fix;
        return postJson(API + 'reached', {
          latitude: fix.latitude,
          longitude: fix.longitude,
          recorded_at: isoNow()
        });
      }).then(function (result) {
        state.posting = false;
        arrivalBusy(false);
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (result.ok && body.status) {
          setNotice('arrive-notice', null);
          applyStage((body.data || {}).stage || 'reached');
          return;
        }
        watchPosition();                                   /* still driving: keep the map live */
        if (body.error === 'too_far_from_customer') {
          var away = ((body.data || {}).distance_m);
          lockFromServer(away);
          setNotice('arrive-notice', 'You look ' + (away ? Math.round(away) + ' m' : 'too far') +
            ' from the customer. Move closer and tap again.', true);
          return;
        }
        var moved = syncStage(body);
        if (moved) { setNotice('arrive-notice', moved, true); return; }
        setNotice('arrive-notice', body.errorMessage || 'Could not record your arrival. Try again.', true);
      }).catch(function (error) {
        state.posting = false;
        arrivalBusy(false);
        watchPosition();
        setNotice('arrive-notice', error && error.code === 1
          ? 'Location permission is needed to confirm you are at the car. Allow it for this page and try again.'
          : 'Could not record your arrival. Check your connection and try again.', true);
      });
    }

    /* ---------------- T6: live car photos, the closing action ---------------- */

    function renderShots() {
      var wrap = byId('shots');
      var uploaded = state.photos.length;
      var total = state.minPhotos || 4;
      wrap.innerHTML = '';
      for (var i = 0; i < total; i += 1) {
        var tile = document.createElement('div');
        var shot = state.photos[i];
        tile.className = 'shot' + (shot ? ' done' : '');
        if (shot && shot.url) {
          var img = document.createElement('img');
          img.src = shot.url;
          img.alt = 'Photo ' + (i + 1);
          tile.appendChild(img);
          tile.title = 'Tap to retake';
          (function (index) {
            tile.addEventListener('click', function () { retakePhoto(index); });
          }(i));
        } else if (shot) {
          tile.textContent = '\u2713';
        } else {
          tile.textContent = String(i + 1);
        }
        wrap.appendChild(tile);
      }
      var button = byId('take-photo');
      button.textContent = uploaded >= total ? 'All photos taken' : 'Take photo ' + (uploaded + 1) + ' of ' + total;
      button.disabled = uploaded >= total;
      var line = (uploaded + ' of ' + total + ' photos');
      text('photo-count', line);
      text('trip-photo-count', line);
      var complete = byId('complete');
      complete.classList.toggle('hidden', !(uploaded >= total && state.stage === 'working'));
      if (uploaded >= total) text('photos-copy', 'All photos uploaded. Tap Complete job to close it.');
    }

    /* ---- Live camera: photos must be taken at that moment, so the normal path is an in-page getUserMedia sheet, not
       a file chooser (which lets the technician pick an old gallery picture). The stream is local to this page and the
       frame goes through uploadPhoto() like before. #camera (file input) is only the fallback when getUserMedia is
       unavailable (and in demo mode, which never touches the camera). */
    var camera = { stream: null, token: 0, open: false, capturing: false };
    var CAMERA_NO_API_COPY = 'This browser cannot open the camera here. Allow camera access, or reload and try again.';
    var CAMERA_BLOCKED_COPY = 'Camera access is blocked. Allow the camera for this page in your browser\'s site settings, then try again.';
    var CAMERA_NONE_COPY = 'No camera was found on this device.';
    var CAMERA_BUSY_COPY = 'The camera could not be started. Close other apps using it, then try again.';

    function cameraSupported() {
      return !!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function');
    }

    /* Stop every track of a stream; used for the live stream and for one that arrives after the sheet was closed. */
    function stopStream(stream) {
      if (!stream) return;
      stream.getTracks().forEach(function (track) { try { track.stop(); } catch (error) { /* already ended */ } });
    }

    /* Close the sheet for any reason (shot taken, cancel, error, teardown, page hidden). Bumping the token makes a
       getUserMedia() that is still pending stop its stream when it resolves instead of attaching it. */
    function closeCamera() {
      camera.token += 1;
      camera.open = false;
      camera.capturing = false;
      var stream = camera.stream;
      camera.stream = null;
      stopStream(stream);
      var video = byId('camera-preview');
      if (video) { try { video.pause(); } catch (error) { /* ignore */ } video.srcObject = null; }
      var shutter = byId('camera-shutter');
      if (shutter) shutter.disabled = true;
      if (byId('camera-sheet')) hide('camera-sheet');
    }

    /* Close the sheet and report why in the photos notice (the sheet itself has no room for a message). */
    function cameraFailed(message) {
      closeCamera();
      setNotice('photos-notice', message, true);
    }

    function cameraErrorCopy(error) {
      var name = error && error.name;
      if (name === 'NotAllowedError' || name === 'SecurityError') return CAMERA_BLOCKED_COPY;
      if (name === 'NotFoundError' || name === 'OverconstrainedError' || name === 'DevicesNotFoundError') return CAMERA_NONE_COPY;
      return CAMERA_BUSY_COPY;
    }

    /* Rear camera at 720p when possible; a missing or over-constrained camera gets one retry with plain video. */
    function requestCameraStream() {
      var devices = navigator.mediaDevices;
      return devices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      }).catch(function (error) {
        var name = error && error.name;
        if (name === 'NotFoundError' || name === 'OverconstrainedError') return devices.getUserMedia({ video: true });
        throw error;
      });
    }

    function openCamera() {
      camera.token += 1;
      var token = camera.token;
      camera.open = true;
      byId('camera-shutter').disabled = true;
      show('camera-status');
      show('camera-sheet');
      var video = byId('camera-preview');

      function frameReady() {
        if (token !== camera.token || !video.videoWidth) return;
        hide('camera-status');
        byId('camera-shutter').disabled = false;
      }

      requestCameraStream().then(function (stream) {
        if (destroyed || token !== camera.token) { stopStream(stream); return; }
        camera.stream = stream;
        video.onloadedmetadata = frameReady;
        video.srcObject = stream;
        var playing = video.play();
        if (playing && typeof playing.then === 'function') playing.then(frameReady, noop);
      }).catch(function (error) {
        if (destroyed || token !== camera.token) return;
        cameraFailed(cameraErrorCopy(error));
      });
    }

    /* Shutter: freeze the current frame at the video's intrinsic size and send it as a JPEG through uploadPhoto(). */
    function capturePhoto() {
      var video = byId('camera-preview');
      if (!camera.open || !camera.stream || camera.capturing || !video.videoWidth) return;
      camera.capturing = true;
      byId('camera-shutter').disabled = true;
      var token = camera.token;
      var canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) {
        if (destroyed || token !== camera.token) return;
        if (!blob) { cameraFailed('Could not capture the photo. Try again.'); return; }
        var file = new File([blob], 'photo-' + Date.now() + '.jpg', { type: 'image/jpeg' });
        closeCamera();
        uploadPhoto(file);
      }, 'image/jpeg', 0.85);
    }

    function takePhoto() {
      if (state.photoBusy || state.photos.length >= state.minPhotos || camera.open) return;
      setNotice('photos-notice', null);
      if (demo) { byId('camera').click(); return; }
      if (!cameraSupported()) {
        setNotice('photos-notice', CAMERA_NO_API_COPY, true);
        byId('camera').click();
        return;
      }
      openCamera();
    }

    function uploadPhoto(file) {
      if (!file || state.photoBusy) return;
      state.photoBusy = true;
      byId('take-photo').disabled = true;
      setNotice('photos-notice', 'Uploading photo ' + (state.photos.length + 1) + '\u2026');

      positionFix().then(function (fix) {
        state.fix = fix;
        var form = new FormData();
        form.append('photo', file, file.name || 'photo.jpg');
        form.append('captured_at', isoNow());
        form.append('latitude', fix.latitude);
        form.append('longitude', fix.longitude);
        return postForm(UPLOAD_API + 'photos', form);
      }).then(function (result) {
        state.photoBusy = false;
        byId('take-photo').disabled = false;
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status) {
          var movedStage = syncStage(body);
          if (movedStage) { setNotice('photos-notice', movedStage, true); return; }
          setNotice('photos-notice', body.errorMessage || 'Could not upload the photo. Try again.', true);
          return;
        }
        var data = body.data || {};
        var url = (window.URL && window.URL.createObjectURL) ? window.URL.createObjectURL(file) : '';
        if (url) objectUrls.push(url);
        state.photos.push({ photo_id: data.photo_id, url: url });
        if (data.min_required) state.minPhotos = data.min_required;
        setNotice('photos-notice', null);
        renderShots();
        if (data.completed || data.stage === 'completed') applyStage('completed');
      }).catch(function () {
        state.photoBusy = false;
        byId('take-photo').disabled = false;
        setNotice('photos-notice', 'Could not upload the photo. Check your connection and try again.', true);
      });
    }

    /* T7: the job closes once the required photos are in. A backend that closes the job on the last photo answers
       the upload with `completed`, and then this button never appears. */
    function completeJob() {
      if (state.posting || state.photoBusy) return;
      state.posting = true;
      var button = byId('complete');
      button.disabled = true;
      setNotice('photos-notice', 'Completing the job\u2026');
      postJson(API + 'complete', {}).then(function (result) {
        state.posting = false;
        arrivalBusy(false);
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (result.ok && body.status) {
          setNotice('photos-notice', null);
          applyStage((body.data || {}).stage || 'completed');
          return;
        }
        if (body.error === 'photos_missing') {
          var data = body.data || {};
          if (data.min_required) state.minPhotos = data.min_required;
          renderShots();
          setNotice('photos-notice', 'Upload all ' + (data.min_required || state.minPhotos) +
            ' photos before completing the job.', true);
          return;
        }
        var moved = syncStage(body);
        if (moved) { setNotice('photos-notice', moved, true); return; }
        setNotice('photos-notice', body.errorMessage || 'Could not complete the job. Try again.', true);
      }).catch(function () {
        state.posting = false;
        button.disabled = false;
        setNotice('photos-notice', 'Could not complete the job. Check your connection and try again.', true);
      });
    }

    /* Retake: allowed only while the job is still working (never after it has completed). */
    function retakePhoto(index) {
      var shot = state.photos[index];
      if (!shot || !shot.photo_id || state.photoBusy || state.stage !== 'working') return;
      if (destroyed) return;
      state.photoBusy = true;
      fetch(API + 'photos/' + encodeURIComponent(shot.photo_id), {
        method: 'DELETE',
        headers: authHeaders({ 'Accept': 'application/json' }),
        credentials: 'same-origin'
      }).then(readJson).then(function (result) {
        state.photoBusy = false;
        var body = result.body || {};
        if (!result.ok || !body.status) {
          setNotice('photos-notice', body.errorMessage || 'Could not remove that photo.', true);
          return;
        }
        state.photos.splice(index, 1);
        setNotice('photos-notice', null);
        renderShots();
      }).catch(function () {
        state.photoBusy = false;
        setNotice('photos-notice', 'Could not remove that photo. Try again.', true);
      });
    }

    function stopCameraWhenHidden() { if (document.hidden) closeCamera(); }

    function startPage() {
      if (!demo && !jobToken && !jobId) {
        showError('Use the link WhatsApp sent you, or ask the ops team for a fresh link.');
        return;
      }
  
      byId('start-trip').addEventListener('click', startTrip);
      byId('allow-location').addEventListener('click', askLocation);
      byId('reload-page').addEventListener('click', function () { window.location.reload(); });
      byId('otp-submit').addEventListener('click', submitOtp);
      byId('otp-input').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') submitOtp();
      });
      byId('reached').addEventListener('click', markReached);
      byId('peek-reached').addEventListener('click', markReached);
      byId('complete').addEventListener('click', completeJob);
      byId('take-photo').addEventListener('click', takePhoto);
      byId('camera-shutter').addEventListener('click', capturePhoto);
      byId('camera-cancel').addEventListener('click', closeCamera);
      byId('camera').addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        event.target.value = '';
        uploadPhoto(file);
      });
      bindSheet();
      /* safety stop: a camera must never stay on once the page is hidden or leaves */
      document.addEventListener('visibilitychange', stopCameraWhenHidden);
      addWindowListener('pagehide', closeCamera);
  
      if (demo) {
        state.detail = JSON.parse(JSON.stringify(DEMO_DETAIL));
        if (demoMock === 'bad-car') {
          var badCar = JSON.parse(JSON.stringify(DEMO_BAD_CAR));
          state.detail.car = badCar.car;
          state.detail.services = badCar.services;
          state.detail.customer = badCar.customer;
        }
        renderDetails(state.detail);
        applyStage('assigning');
        hide('loading');
        show('assigning-body');
        if (demoStage === 'trip') {
          state.fix = DEMO_FIX;
          state.route = DEMO_ROUTE;
          state.eta = 6;
          applyStage('on_the_way');
          showTrip();
        }
        return;
      }

      /* Ask for location now, alongside the job fetch (also on a mid-trip reload), so the technician has already
         answered by the time they reach Start Trip. Neither call can block rendering or fail the fetch below. */
      watchPermission();
      renderLocationGate();
      askLocation();

      var jobUrl = API + 'job' +(jobId && !jobToken ? '?job_id=' + encodeURIComponent(jobId) : '');
      getJson(jobUrl).then(function (result) {
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status || !body.data) {
          showError(body.errorMessage || 'Ask the ops team for a fresh link.');
          return;
        }
        state.detail = body.data;
        state.interval = state.detail.location_interval_sec || 15;
        renderDetails(state.detail);
        applyStage(state.detail.stage || 'assigning');
        hide('loading');
        simResume();   /* Simulate drive: restore the switch after a reload (no-op unless it was on) */
        if ((state.detail.stage || 'assigning') === 'assigning') {
          show('assigning-body');
          return;
        }
        // Reloaded mid-trip (or the job moved on): go straight back to the map and let the location poll rebuild the
        // ETA instead of offering Start Trip again.
        showTrip();
        if (DRIVING_STAGES[state.stage]) { watchPosition(); schedulePoll(); }
        if (state.stage === 'working' || state.stage === 'completed') setSheet(true);
      }).catch(function () {
        showError('Could not load the job. Check your connection and reload.');
      });
    }

    /* ---------------- Leaflet (first boot only) ---------------- */

    function withLeaflet(done) {
      if (window.L) { L = window.L; done(); return; }
      var remaining = 2;
      function settled() {
        remaining -= 1;
        if (remaining > 0 || destroyed) return;
        L = window.L || null;
        done();
      }
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = LEAFLET_CSS;
      link.onload = settled;
      link.onerror = settled;
      var script = document.createElement('script');
      script.src = LEAFLET_JS;
      script.onload = settled;
      script.onerror = settled;
      injected.push(link, script);
      document.head.appendChild(link);
      document.head.appendChild(script);
    }

    simBuildUi();   /* Simulate drive switch (testing only; renders nothing when SHOW_TEST_SWITCH is false) */
    withLeaflet(startPage);

    return function teardown() {
      if (destroyed) return;
      destroyed = true;
      closeCamera();
      document.removeEventListener('visibilitychange', stopCameraWhenHidden);
      if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
      stopWatch();
      simHalt();
      if (permissionStatus) { permissionStatus.onchange = null; permissionStatus = null; }
      windowListeners.forEach(function (entry) { window.removeEventListener(entry[0], entry[1]); });
      windowListeners = [];
      if (headerObserver) { headerObserver.disconnect(); headerObserver = null; }
      if (map) {
        try { map.remove(); } catch (error) { /* already gone */ }
        map = null; routeLayer = null; techMarker = null; pinMarker = null;
      }
      objectUrls.forEach(function (url) { try { window.URL.revokeObjectURL(url); } catch (error) { /* ignore */ } });
      objectUrls = [];
      injected.forEach(function (node) { if (node.parentNode) node.parentNode.removeChild(node); });
      injected = [];
      /* Fresh markup also drops every element listener bound by startPage(). */
      root.innerHTML = initialMarkup;
      document.body.style.overflow = previousOverflow;
      started = false;
    };
}

/* Standalone entry: replaces the website's React route (index.js / RsaTechnicianJob.js).
   Everything the page needs comes from the URL or from window.RSA_CONFIG (see config.json):

     ?job=<jobToken>          the technician link token (also accepted: ?token=)
     &api=<url>               main API base, e.g. https://abc.ngrok-free.app/api/
     &upload_api=<url>        photo-upload API base (defaults to &api=)
     &ngrok=0                 do not add the ngrok-skip-browser-warning header
     ?demo=1                  boot.js demo mode: no API calls, sample data

   `markup`, `css` and `boot` are defined above this block by build.js. */

var cfg = window.RSA_CONFIG || {};
var query = new URLSearchParams(window.location.search);
var allowQuery = cfg.allowQueryApi !== false;

function pick(name, fallback) {
  var fromUrl = allowQuery ? (query.get(name) || '').trim() : '';
  return fromUrl || String(fallback || '').trim();
}

var jobToken = (query.get('job') || query.get('token') || cfg.jobToken || '').trim();
var apiBase = pick('api', cfg.apiBase);
var uploadApiBase = pick('upload_api', cfg.uploadApiBase) || apiBase;
var isDemo = query.get('demo') === '1';

/* ngrok's free tier answers browser requests with an HTML warning page unless this header is present.
   Added only for ngrok hosts. NOTE: the backend's CORS must list `ngrok-skip-browser-warning` in
   Access-Control-Allow-Headers, otherwise the browser blocks the call; use &ngrok=0 to turn this off. */
var ngrokHeader = query.get('ngrok') !== '0' && cfg.ngrokSkipWarning !== false;
var nativeFetch = window.fetch.bind(window);
window.fetch = function (url, init) {
  try {
    var target = typeof url === 'string' ? url : (url && url.url) || '';
    if (ngrokHeader && /ngrok/i.test(target)) {
      init = Object.assign({}, init);
      init.headers = Object.assign({}, init.headers, { 'ngrok-skip-browser-warning': '1' });
    }
  } catch (error) { /* fall through to a plain fetch */ }
  return nativeFetch(url, init);
};

function showSetupProblem(message) {
  var root = document.getElementById('rsa-job');
  root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:520px;margin:48px auto;padding:20px;' +
    'border:1px solid #f5c2c7;background:#fff5f5;color:#842029;border-radius:10px;line-height:1.5">' +
    '<strong>Page not set up</strong><br>' + message + '</div>';
}

function start() {
  var style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);

  var root = document.getElementById('rsa-job');
  if (!isDemo && !apiBase) {
    showSetupProblem('No API address. Open this page as <code>?job=&lt;token&gt;&amp;api=https://your-api-host/api/</code> ' +
      'or set <code>apiBase</code> in config.json and rebuild.');
    return;
  }
  if (!isDemo && !jobToken) {
    showSetupProblem('No job token. Open this page as <code>?job=&lt;token&gt;&amp;api=...</code>.');
    return;
  }
  root.innerHTML = markup;
  boot({ jobToken: jobToken, apiBase: apiBase, uploadApiBase: uploadApiBase });

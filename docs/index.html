const css = `/* Everything is scoped under #rsa-job: html, body and header are never styled globally. */

#rsa-job {
  --ink: #101820; --ink-2: #3a444f; --muted: #6b7885; --line: #e3e8ee; --canvas: #f4f6f9; --tint: #ecf3fc;
  --amber: #f9c22e; --amber-ink: #785a00; --blue: #1557c0; --green: #1f9d55; --red: #ba1a1a;
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100%; z-index: 100000;
  margin: 0; background: var(--canvas); color: var(--ink); overflow: hidden;
  font: 500 15px/1.45 Inter, Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
#rsa-job, #rsa-job * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
#rsa-job button { font: inherit; border: 0; cursor: pointer; }
#rsa-job button:focus-visible, #rsa-job [role="button"]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* the GoMechanic logo (white artwork used as a mask, so it takes the text colour) */
#rsa-job .gm-logo {
  display: block; flex: none; width: 104px; height: 21px; background: currentColor;
  -webkit-mask: ${RSA_LOGO} left center / contain no-repeat; mask: ${RSA_LOGO} left center / contain no-repeat;
}
#rsa-job .gm-logo.ink { color: var(--ink); margin: 0 auto 18px; width: 136px; height: 27px; }

/* ---------- toolbar ---------- */
#rsa-job header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  background: var(--ink); color: #fff; box-shadow: 0 1px 0 rgba(255, 255, 255, .06);
  height: calc(56px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 10px 0 14px;
  display: grid; grid-template-columns: auto minmax(0, max-content) minmax(0, 1fr) auto auto; grid-template-areas: "logo stage . send sim";
  align-content: center; align-items: center; column-gap: 6px;
}
#rsa-job header .gm-logo { grid-area: logo; }
/* narrow phones: the car mark alone, so the status and switches keep their room */
@media (max-width: 459px) { #rsa-job header .gm-logo { width: 31px; -webkit-mask-size: auto 100%; mask-size: auto 100%; } }
#rsa-job header .brand, #rsa-job header h1 { display: none; }
#rsa-job header .stage {
  grid-area: stage; justify-self: start; display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; margin: 0; padding: 6px 11px 6px 9px;
  border-radius: 999px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .14);
  color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap;
}
#rsa-job header .stage::before { content: ""; display: inline-block; vertical-align: 1px; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--amber); }
#rsa-job header .stage[data-stage="on_the_way"]::before, #rsa-job header .stage[data-stage="almost_here"]::before { background: #5b9bff; }
#rsa-job header .stage[data-stage="reached"]::before, #rsa-job header .stage[data-stage="completed"]::before { background: #3ad07a; }
#rsa-job header .stage[data-stage="cancelled"]::before { background: #ff6b5e; }
#rsa-job .tb-switch {
  justify-self: end; display: flex; align-items: center; gap: 5px; min-width: 0; padding: 6px 8px; border-radius: 999px;
  background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .12); color: #cfd6de;
  font: 600 11px/1.2 Inter, Roboto, system-ui, sans-serif; white-space: nowrap; cursor: pointer;
}
#rsa-job .tb-switch input { margin: 0; flex: none; accent-color: var(--amber); }
#rsa-job .tb-switch span { overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
@media (max-width: 379px) { #rsa-job header .stage { font-size: 12px; padding: 5px 9px 5px 8px; } #rsa-job header { column-gap: 5px; padding-left: 12px; } }
#rsa-job .tb-switch.off { background: rgba(217, 48, 37, .85); border-color: transparent; color: #fff; }

/* ---------- shared pieces ---------- */
#rsa-job .card {
  background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px;
}
#rsa-job .card h2 {
  display: flex; align-items: center; gap: 8px; margin: 0 0 12px;
  font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #4a5560;
}
#rsa-job .card h2::before {
  content: ""; width: 18px; height: 18px; flex: none; background: var(--blue);
  -webkit-mask: var(--ic) center / contain no-repeat; mask: var(--ic) center / contain no-repeat;
}
#rsa-job .c-customer { --ic: ${RSA_ICONS.user}; }
#rsa-job .c-vehicle { --ic: ${RSA_ICONS.car}; }
#rsa-job .c-services { --ic: ${RSA_ICONS.wrench}; }
#rsa-job .c-job { --ic: ${RSA_ICONS.clipboard}; }
#rsa-job .c-arrive { --ic: ${RSA_ICONS.pin}; }
#rsa-job .c-otp { --ic: ${RSA_ICONS.shield}; }
#rsa-job .c-photos { --ic: ${RSA_ICONS.camera}; }
#rsa-job .c-done { --ic: ${RSA_ICONS.check}; }
#rsa-job .card h2 { --ic: ${RSA_ICONS.clipboard}; }
#rsa-job .c-customer h2 { --ic: ${RSA_ICONS.user}; } #rsa-job .c-vehicle h2 { --ic: ${RSA_ICONS.car}; }
#rsa-job .c-services h2 { --ic: ${RSA_ICONS.wrench}; } #rsa-job .c-arrive h2 { --ic: ${RSA_ICONS.pin}; }
#rsa-job .c-otp h2 { --ic: ${RSA_ICONS.shield}; } #rsa-job .c-photos h2 { --ic: ${RSA_ICONS.camera}; }
#rsa-job .c-done h2 { --ic: ${RSA_ICONS.check}; }

#rsa-job .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 8px 0; }
#rsa-job .row + .row { border-top: 1px solid #eef1f4; }
#rsa-job .row .label { color: var(--muted); flex: 0 0 auto; font-weight: 600; }
#rsa-job .row .value { text-align: right; font-weight: 700; word-break: break-word; }
#rsa-job .row .value.tiny { font: 700 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-2); }
#rsa-job .name { font-size: 22px; line-height: 1.2; font-weight: 800; margin: 0 0 4px; letter-spacing: -.01em; }
#rsa-job .c-customer .row { padding: 4px 0 10px; }
#rsa-job .c-customer .row .value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; color: var(--ink-2); }

#rsa-job .addr { display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 12px 14px; border-radius: 12px; background: var(--tint); }
#rsa-job .addr::before {
  content: ""; width: 20px; height: 20px; flex: none; margin-top: 1px; background: var(--amber-ink);
  -webkit-mask: ${RSA_ICONS.pin} center / contain no-repeat; mask: ${RSA_ICONS.pin} center / contain no-repeat;
}
#rsa-job .address { flex: 1 1 auto; margin: 0; color: var(--ink); font-weight: 500; line-height: 1.45; min-width: 0; }
#rsa-job .link-btn {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; margin: -4px -4px -4px 0;
  border-radius: 10px; background: #dde9f8; color: var(--ink); font-size: 13px; font-weight: 700;
}
#rsa-job .link-btn::before {
  content: ""; width: 16px; height: 16px; background: currentColor;
  -webkit-mask: ${RSA_ICONS.copy} center / contain no-repeat; mask: ${RSA_ICONS.copy} center / contain no-repeat;
}

/* vehicle: model on the left, an HSRP-style number plate on the right */
#rsa-job .veh { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
#rsa-job .veh-name { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.25; min-width: 0; flex: 1 1 140px; }
#rsa-job .plate {
  display: inline-flex; align-items: stretch; max-width: 100%; border: 1.5px solid var(--ink); border-radius: 5px; background: #fff;
  font: 800 15px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; color: var(--ink);
  white-space: pre-line; text-align: center; overflow: hidden; overflow-wrap: anywhere;
}
#rsa-job .plate::before {
  content: "IND"; display: flex; align-items: flex-end; justify-content: center; width: 22px; padding: 0 0 4px; flex: none;
  background: #1a4fbf; color: #fff; font: 800 7px/1 Inter, Roboto, sans-serif; letter-spacing: 0;
}
#rsa-job .plate:empty { display: none; }
#rsa-job .veh .plate { padding: 0 10px 0 0; min-height: 34px; align-items: center; }
#rsa-job .veh .plate::before { align-self: stretch; margin-right: 9px; }

/* services: one tinted row each, with a tick */
#rsa-job .services { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
#rsa-job .services li {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border-radius: 12px;
  background: var(--tint); font-weight: 700; font-size: 16px;
}
#rsa-job .services li::after {
  content: ""; width: 22px; height: 22px; flex: none; background: var(--amber-ink);
  -webkit-mask: ${RSA_ICONS.check} center / contain no-repeat; mask: ${RSA_ICONS.check} center / contain no-repeat;
}
#rsa-job .muted { color: var(--muted); }
#rsa-job .tiny { font-size: 12px; }
#rsa-job #services-empty { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--canvas); font-size: 14px; }

/* notices: amber (info / progress), red (error), blue (screen-on hint) */
#rsa-job .notice {
  display: flex; align-items: flex-start; gap: 10px; margin: 12px 0 0; padding: 12px 14px; border-radius: 12px;
  background: #fff6dc; color: #4a3800; font-size: 14px; font-weight: 600; line-height: 1.4;
}
#rsa-job .notice::before {
  content: ""; width: 18px; height: 18px; flex: none; margin-top: 1px; background: #c77700;
  -webkit-mask: ${RSA_ICONS.alert} center / contain no-repeat; mask: ${RSA_ICONS.alert} center / contain no-repeat;
}
#rsa-job .notice.error { background: #ffdad6; color: #93000a; }
#rsa-job .notice.error::before { background: var(--red); }
#rsa-job #screen-hint { background: #e3eefc; color: #0d3b86; }
#rsa-job #screen-hint::before { background: var(--blue); -webkit-mask-image: ${RSA_ICONS.phone}; mask-image: ${RSA_ICONS.phone}; }

/* buttons */
#rsa-job .start, #rsa-job .action, #rsa-job .peek-action, #rsa-job .gate-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
  border-radius: 14px; font-weight: 800; letter-spacing: .01em; transition: transform .08s ease, filter .15s ease;
}
#rsa-job .start:active, #rsa-job .action:active, #rsa-job .peek-action:active, #rsa-job .gate-btn:active { transform: scale(.985); filter: brightness(.96); }
#rsa-job .start::before, #rsa-job .action::before, #rsa-job .peek-action::before {
  content: ""; width: 22px; height: 22px; flex: none; background: currentColor;
  -webkit-mask: var(--btn-ic) center / contain no-repeat; mask: var(--btn-ic) center / contain no-repeat;
}
#rsa-job .action { height: 56px; margin-top: 14px; background: var(--ink); color: #fff; font-size: 17px; --btn-ic: ${RSA_ICONS.check}; }
#rsa-job .action.primary { background: var(--amber); color: var(--ink); box-shadow: 0 2px 0 #d9a514; }
#rsa-job .action[disabled], #rsa-job .peek-action[disabled] { opacity: .5; box-shadow: none; }
#rsa-job #reached, #rsa-job #peek-reached { --btn-ic: ${RSA_ICONS.pin}; }
#rsa-job #otp-submit { --btn-ic: ${RSA_ICONS.shield}; }
#rsa-job #take-photo { --btn-ic: ${RSA_ICONS.camera}; }
#rsa-job #complete { background: var(--green); color: #fff; box-shadow: 0 2px 0 #16783f; }
#rsa-job .state { padding: 32px 20px; text-align: center; color: var(--muted); font-weight: 600; }
#rsa-job .state strong { display: block; color: var(--ink); font-size: 19px; font-weight: 800; margin-bottom: 6px; }
#rsa-job #loading .spinner { margin: 0 auto 14px; }
#rsa-job .state-icon {
  display: block; width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 50%; background: #ffdad6; position: relative;
}
#rsa-job .state-icon::after {
  content: ""; position: absolute; inset: 14px; background: var(--red);
  -webkit-mask: ${RSA_ICONS.linkoff} center / contain no-repeat; mask: ${RSA_ICONS.linkoff} center / contain no-repeat;

    function vehicleFields(car) {

    function currentPosition() {

        if (!navigator.geolocation) { reject(new Error('no_geolocation')); return; }

    /* Google encoded polyline, precision 5 - the format the route is sent and drawn in. */
    function decodePolyline(encoded) {

        do { byte = encoded.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20 && index <= encoded.length);

        shift = 0; result = 0;
        do { byte = encoded.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20 && index <= encoded.length);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        points.push([lat / 1e5, lng / 1e5]);
      }
      return points;
    }

    /* The page draws the trip route once at Start (T2) with the Google Routes API; the backend stores it and serves it
       to the customer. Any failure (no key, API not enabled, network) resolves null: the trip starts without a route
       and the backend draws its own. TRAFFIC_UNAWARE keeps the call on the cheaper Essentials SKU. */
    function drawRoute(from, to) {
      if (!from || !to || to.latitude === undefined || to.longitude === undefined) return Promise.resolve(null);
      if (!routesKey) return Promise.resolve(null);
      if (destroyed) return halted();
      function point(at) { return { location: { latLng: { latitude: Number(at.latitude), longitude: Number(at.longitude) } } }; }
      /* Third-party origin: plain fetch, no auth headers or credentials. The job token must never go to a third-party origin. */
      return fetch(GOOGLE_ROUTES_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Goog-Api-Key': routesKey,
          'X-Goog-FieldMask': 'routes.distanceMeters,routes.duration,routes.polyline.encodedPolyline'

          route_distance_meters: Math.round(route.distanceMeters || 0),
          route_duration_minutes: Math.max(1, Math.round(seconds / 60)),

    function renderDetails(detail) {

    function haversineM(a, b) {
      var rad = Math.PI / 180;
      var dLat = (b.latitude - a.latitude) * rad;
      var dLon = (b.longitude - a.longitude) * rad;
      var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(a.latitude * rad) * Math.cos(b.latitude * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    function fixAccuracy() {
      if (demo) return demoAcc;
      return state.fix ? state.fix.accuracy : 0;
    }

    /* Distance to the customer from the latest fix, or null when it cannot be known (no fix, no coordinates). */
    function distanceToCustomer() {
      if (demo) return demoAway;
      var at = (state.detail && state.detail.customer_location) || {};
      if (!state.fix || typeof at.latitude !== 'number' || typeof at.longitude !== 'number' ||

          !isFinite(state.fix.latitude) || !isFinite(state.fix.longitude)) return null;
      return haversineM(state.fix, at);

    /* Show the arrival action only while unlocked; locked shows one distance line instead. Unknown distance never locks. */
    function renderGate() {

      var offered = arriving && !lockedNow;

      if (offered && !reachedWasOffered && sheetState === 'closed') setSheetState('peek');

    /* Re-evaluate from the current fix (every watch tick, fresh fix and stage change). */
    function updateGate() {

      if (state.stage) renderEta();   /* the distance in "X min · Y away" follows every fix */
    }

    /* The server said we are too far: lock now, whatever the last fix said, until a fix reads within the radius. */
    function lockFromServer(distance) {

      state.serverAway = distance;      /* held until the next fix, so a stage poll cannot undo it */
      state.away = distance;
      state.locked = true;
      renderGate();
      renderEta();
    }

    function setFix(fix) {
      if (sim.on) return;   /* Simulate drive: real GPS fixes are ignored while the virtual position drives state.fix */
      state.fix = fix;
      state.serverAway = null;
      state.gpsError = null;

      setPermission('granted');
      updateGate();
    }

    function applyStage(stage) {
      state.stage = stage;
      var pill = byId('stage-pill');
      pill.textContent = STAGE_LABELS[stage] || stage;
      pill.setAttribute('data-stage', stage);   /* styling only: the pill's dot colour follows the stage */
      show('stage-pill');
      renderEta();

      /* One block at a time: arrival tap while driving, OTP once reached, photos while working, a closing line at end. */
      updateGate();
      if (OTP_STAGES[stage]) setSheet(true);            /* the OTP is the next action: show it, do not make them hunt */
      byId('otp-block').classList.toggle('hidden', !OTP_STAGES[stage]);
      byId('photos-block').classList.toggle('hidden', !PHOTO_STAGES[stage]);
      byId('done-block').classList.toggle('hidden', stage !== 'completed' && stage !== 'cancelled');
      if (stage === 'completed' || stage === 'cancelled') {
        byId('done-line').textContent = stage === 'completed'
          ? ('Job completed \u00b7 ' + state.photos.length + ' photo' + (state.photos.length === 1 ? '' : 's') + ' uploaded')
          : 'Job cancelled by support';

          ? 'The invoice has been generated. Nothing else is needed from you.'
          : 'Nothing else is needed from you. Support will follow up.');
        setSheet(true);
        stopPolling();
        closeGate();
      }
      if (stage === 'working') {
        stopPolling();
        setSheet(true);
      }
      renderShots();
      syncFollowToStage();
      syncWakeLock();
      checkGps();

    /* "450 m" below a kilometre (to the nearest 10 m), "1.2 km" from a kilometre up. */
    function formatDistance(metres) {
      if (metres >= 1000) return (Math.round(metres / 100) / 10) + ' km';
      return metres < 10 ? '<10 m' : (Math.round(metres / 10) * 10) + ' m';
    }

    /* Straight-line distance left to the customer (state.away), only while still driving to them; '' when unknown. */
    function awayText() {
      if (!ARRIVAL_STAGES[state.stage]) return '';
      return (typeof state.away === 'number' && isFinite(state.away)) ? formatDistance(state.away) : '';
    }

    function renderEta() {
      var stageLabel = STAGE_LABELS[state.stage] || '';
      var dist = awayText();
      var label = stageLabel;
      if (state.stage === 'reached') label = 'At the customer';
      else if (DRIVING_STAGES[state.stage]) {
        if (state.eta) label = 'Arriving in ' + state.eta + ' min' + (dist ? ' \u00b7 ' + dist : '');
        else if (dist) label = stageLabel + ' \u00b7 ' + dist;
      }
      byId('eta-text').textContent = label;
      var customer = (state.detail && state.detail.customer) || {};
      text('peek-name', customer.name, 'Customer');
      var how = state.eta ? (state.eta + ' min' + (dist ? ' \u00b7 ' + dist : '') + ' away') : (dist ? dist + ' away' : '');
      byId('peek-what').textContent = how ? (how + ' \u00b7 ' + stageLabel) : stageLabel;
      sheetSummary = how || stageLabel;   /* shown in the sheet's handle while it is closed */
      updateHandle();
    }

    /* ---------------- map (Google Maps JavaScript API) ---------------- */

    var map = null, routeLines = [], techMarker = null, pinMarker = null, accuracyCircle = null, trafficLayer = null;
    var mapListeners = [];
    var HtmlMarker = null;     /* overlay class, built once google.maps is loaded */
    var follow = false;        /* follow mode: the map keeps the technician in view while driving */
    var followButton = null;
    var markerAnimation = null;
    var gpsLost = false;

    /* A small white label above a map marker ("Customer", "You"), wrapped so both markers share one centred layout. */
    function markerChip(label) {
      return '<span style="display:block;margin:0 auto 4px;width:max-content;max-width:86px;background:#fff;color:#101820;' +
        'font:700 11px/1 system-ui,-apple-system,sans-serif;padding:4px 8px;border-radius:999px;' +
        'box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap">' + label + '</span>';
    }

    var PIN_HTML = markerChip(MARKER_LABEL_CUSTOMER) +
      '<svg width="30" height="40" viewBox="0 0 30 40" style="display:block;margin:0 auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))">' +
      '<path d="M15 39C15 39 2 25 2 14.5 2 7.6 7.8 2 15 2s13 5.6 13 12.5C28 25 15 39 15 39z" fill="#d93025" stroke="#fff" stroke-width="2.5"/>' +
      '<circle cx="15" cy="11.5" r="3.6" fill="#fff"/><path d="M8.5 21.5c0-3.6 3-5.8 6.5-5.8s6.5 2.2 6.5 5.8z" fill="#fff"/></svg>';

    /* The technician: a blue disc with a car while the direction of travel is unknown, a white arrow pointing along it once known. */
    var TECH_HTML = markerChip(MARKER_LABEL_TECH) +
      '<div style="box-sizing:border-box;margin:0 auto;width:34px;height:34px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center">' +
      '<svg data-tech="car" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M5 12l1.6-4.6A2 2 0 0 1 8.5 6h7a2 2 0 0 1 1.9 1.4L19 12" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>' +
      '<rect x="3" y="12" width="18" height="5.5" rx="2" fill="#fff"/>' +
      '<circle cx="7.5" cy="18" r="2" fill="#fff" stroke="#1a73e8" stroke-width="1"/><circle cx="16.5" cy="18" r="2" fill="#fff" stroke="#1a73e8" stroke-width="1"/></svg>' +
      '<svg data-tech="arrow" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="display:none;transition:transform .4s ease-out">' +
      '<path d="M12 2.5l7.5 18-7.5-4.2-7.5 4.2z" fill="#fff"/></svg></div>';

    /* HTML markers drawn through an OverlayView: they need no Map ID and keep the page's existing marker look. */
    function makeHtmlMarkerClass() {
      function Overlay(position, html, anchorX, anchorY, zIndex, decorate) {
        this.position = position;
        this.html = html;
        this.anchorX = anchorX;
        this.anchorY = anchorY;
        this.zIndex = zIndex;
        this.decorate = decorate || null;
        this.div = null;
      }
      Overlay.prototype = new G.OverlayView();
      Overlay.prototype.onAdd = function () {
        var div = document.createElement('div');
        div.style.position = 'absolute';
        div.style.width = (this.anchorX * 2) + 'px';
        div.style.pointerEvents = 'none';     /* drags and pinches go through to the map */
        div.style.zIndex = String(this.zIndex);
        div.innerHTML = this.html;
        this.div = div;
        this.getPanes().floatPane.appendChild(div);
      };
      Overlay.prototype.draw = function () {
        if (!this.div) return;
        var projection = this.getProjection();
        var point = projection && projection.fromLatLngToDivPixel(this.position);
        if (!point) return;
        this.div.style.left = (point.x - this.anchorX) + 'px';
        this.div.style.top = (point.y - this.anchorY) + 'px';
        if (this.decorate) this.decorate(this.div);
      };
      Overlay.prototype.onRemove = function () {
        if (this.div && this.div.parentNode) this.div.parentNode.removeChild(this.div);
        this.div = null;
      };
      Overlay.prototype.setPosition = function (position) { this.position = position; this.draw(); };
      Overlay.prototype.getPosition = function () { return this.position; };
      return Overlay;
    }

    /* Arrow vs car, the arrow's rotation, and a faded marker while the GPS is lost. */
    function decorateTech(div) {
      var car = div.querySelector('[data-tech="car"]');
      var arrow = div.querySelector('[data-tech="arrow"]');
      var known = typeof state.heading === 'number' && isFinite(state.heading);
      if (car) car.style.display = known ? 'none' : 'block';
      if (arrow) {
        arrow.style.display = known ? 'block' : 'none';
        if (known) arrow.style.transform = 'rotate(' + Math.round(state.heading) + 'deg)';
      }
      div.style.opacity = gpsLost ? '0.45' : '1';
    }

    function latLng(lat, lng) { return new G.LatLng(Number(lat), Number(lng)); }

    function pinLatLng() {
      var location = (state.detail && state.detail.customer_location) || {};
      var lat = Number(location.latitude), lng = Number(location.longitude);
      if (location.latitude === null || location.latitude === undefined || location.latitude === '' ||
          !isFinite(lat) || !isFinite(lng)) return null;
      return latLng(lat, lng);
    }

    function onMap(target, event, handler) {
      mapListeners.push(G.event.addListener(target, event, handler));
    }

    function buildMap() {
      if (!G) return;   /* Google Maps could not be loaded: the trip sheet still works without the map */
      var pin = pinLatLng();
      if (!map) {
        if (!HtmlMarker) HtmlMarker = makeHtmlMarkerClass();
        map = new G.Map(byId('map'), {
          center: pin || latLng(20.59, 78.96),
          zoom: pin ? 14 : 5,
          disableDefaultUI: true,
          zoomControl: true,
          zoomControlOptions: { position: G.ControlPosition.RIGHT_BOTTOM },
          gestureHandling: 'greedy',     /* one finger pans: this is a full-screen map, not a map inside a scrolling page */
          clickableIcons: false,
          keyboardShortcuts: false,
          /* shop and business labels add clutter while driving; roads, landmarks and transit stay */
          styles: [{ featureType: 'poi.business', stylers: [{ visibility: 'off' }] }]
        });
        /* Live congestion on the roads ahead; part of the map load, no extra request. */
        trafficLayer = new G.TrafficLayer();
        trafficLayer.setMap(map);
        buildFollowButton();
        /* The technician moved the map: stop pulling it back to them until they tap Re-centre. */
        onMap(map, 'dragstart', function () { if (follow) setFollow(false, true); });
      }
      if (pin) {
        if (pinMarker) pinMarker.setPosition(pin);
        else {
          pinMarker = new HtmlMarker(pin, PIN_HTML, 43, 62, 1);   /* the tip of the pin sits exactly on the customer's location */
          pinMarker.setMap(map);
        }
      }
      drawRouteLine();
      refreshView();
    }

    /* ---- route progress: where the technician is along the route, so the driven part can be greyed out ---- */
    var routeGeo = null;   /* { src, cum, idx, t, along, snapped, off, drawnAlong } for the route array now in state.route */

    function routeGeometry() {
      var r = state.route;
      if (routeGeo && routeGeo.src === r) return routeGeo;
      routeGeo = { src: r, cum: [0], idx: 0, t: 0, along: 0, snapped: null, off: false, drawnAlong: -1 };   /* a new route starts again from its beginning */
      for (var i = 1; i < r.length; i += 1) {
        routeGeo.cum.push(routeGeo.cum[i - 1] + haversineM(
          { latitude: r[i - 1][0], longitude: r[i - 1][1] }, { latitude: r[i][0], longitude: r[i][1] }));
      }
      return routeGeo;
    }

    /* Nearest point of segment a-b to fix p, on a flat local grid in metres (plenty accurate over a few hundred metres). */
    function projectOnSegment(a, b, p) {
      var mx = 111320 * Math.cos(p.latitude * Math.PI / 180), my = 110540;
      var ax = (a[1] - p.longitude) * mx, ay = (a[0] - p.latitude) * my;
      var bx = (b[1] - p.longitude) * mx, by = (b[0] - p.latitude) * my;
      var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      var t = len2 > 0 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2)) : 0;
      var cx = ax + dx * t, cy = ay + dy * t;
      return { t: t, dist: Math.sqrt(cx * cx + cy * cy), point: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t] };
    }

    /* Moves the matched point forward to the technician's position. Returns true when the line should be redrawn.
       The matched point only ever moves forward, and a fix far from the route changes nothing. */
    function updateRouteProgress(fix) {
      var r = state.route;
      if (!r || r.length < 2 || !fix || !isFinite(fix.latitude) || !isFinite(fix.longitude)) return false;
      var g = routeGeometry(), best = null;
      function scan(fromAlong, toAlong) {
        for (var i = 0; i < r.length - 1; i += 1) {
          if (g.cum[i + 1] < fromAlong || g.cum[i] > toAlong) continue;
          var pr = projectOnSegment(r[i], r[i + 1], fix);
          var along = g.cum[i] + pr.t * (g.cum[i + 1] - g.cum[i]);
          if (!best || pr.dist < best.dist - 0.5 || (Math.abs(pr.dist - best.dist) <= 0.5 && along < best.along)) {
            best = { i: i, t: pr.t, dist: pr.dist, along: along, point: pr.point };
          }
        }
      }
      var accuracy = Number(fix.accuracy);
      var limit = Math.max(ROUTE_OFF_M, 2 * (isFinite(accuracy) ? accuracy : 0));
      scan(g.along - ROUTE_BACK_M, g.along + ROUTE_AHEAD_M);
      if (!best || best.dist > limit) { best = null; scan(g.along - ROUTE_BACK_M, Infinity); }   /* lost it (GPS gap, reload): look along the rest */
      if (!best || best.dist > limit) { g.off = true; return false; }                           /* off route: keep what is drawn */
      g.off = false;
      if (best.along < g.along) return false;                                                    /* never backwards */
      g.idx = best.i; g.t = best.t; g.along = best.along; g.snapped = best.point;
      g.fixPt = [fix.latitude, fix.longitude]; g.fixGap = best.dist;   /* the line starts at the technician, then joins the road */
      if (g.drawnAlong >= 0 && g.along - g.drawnAlong < ROUTE_REDRAW_M) return false;
      g.drawnAlong = g.along;
      return true;
    }

    /* The route still ahead: from the matched point on the road to the end (the whole route before any match). */
    function remainingRoute() {
      var r = state.route;
      if (!r || r.length < 2) return [];
      var g = routeGeometry();
      if (!g.snapped) return r;
      var out = (g.fixPt && g.fixGap > 3) ? [g.fixPt, g.snapped] : [g.snapped];
      for (var i = g.idx + 1; i < r.length; i += 1) out.push(r[i]);
      return out;
    }

    /* The route already driven: from the start to the matched point on the road ([] before any match). */
    function passedRoute() {
      var r = state.route;
      if (!r || r.length < 2) return [];
      var g = routeGeometry();
      if (!g.snapped) return [];
      var out = r.slice(0, g.idx + 1);
      out.push(g.snapped);
      return out;
    }

    function toPath(points) {
      return points.length >= 2 ? points.map(function (point) { return latLng(point[0], point[1]); }) : [];
    }

    /* Move the grey / blue split on the lines already on the map (no new objects, no network).
       routeLines = [driven casing, driven line, ahead casing, ahead line]. */
    function trimRouteLine() {
      if (routeLines.length !== 4) { drawRouteLine(); return; }
      var passed = toPath(passedRoute()), ahead = toPath(remainingRoute());
      routeLines[0].setPath(passed); routeLines[1].setPath(passed);
      routeLines[2].setPath(ahead); routeLines[3].setPath(ahead);
    }

    function clearRouteLines() {
      routeLines.forEach(function (line) { line.setMap(null); });
      routeLines = [];
    }

    function drawRouteLine() {
      if (!map) return;
      clearRouteLines();
      /* Only a real road route is ever drawn. Without one the map shows just the two markers while ensureRoute()
         fetches it; a straight or dashed line would point the technician across buildings. */
      if (!state.route || state.route.length < 2) return;
      if (state.fix) updateRouteProgress(state.fix);   /* a (re)drawn route is split at the technician at once, not at the next fix */
      var passed = toPath(passedRoute()), ahead = toPath(remainingRoute());
      /* driven: grey and a little thinner, under the road still ahead */
      routeLines.push(new G.Polyline({ map: map, path: passed, strokeColor: '#ffffff', strokeOpacity: 0.9, strokeWeight: 8, zIndex: 1, clickable: false }));
      routeLines.push(new G.Polyline({ map: map, path: passed, strokeColor: '#9aa4ae', strokeOpacity: 1, strokeWeight: 4, zIndex: 2, clickable: false }));
      /* ahead: blue, not the brand yellow - the traffic layer paints roads green / orange / red and yellow got lost among them */
      routeLines.push(new G.Polyline({ map: map, path: ahead, strokeColor: '#ffffff', strokeOpacity: 0.95, strokeWeight: 9, zIndex: 3, clickable: false }));
      routeLines.push(new G.Polyline({ map: map, path: ahead, strokeColor: '#1557c0', strokeOpacity: 1, strokeWeight: 5, zIndex: 4, clickable: false }));
    }

    /* Pixels at the top of the map covered by the header and the ETA pill (the sheet is kept off the map, see syncMapInset). */
    function topOverlay() {
      var mapEl = byId('map');
      var pill = byId('eta-pill');
      if (!mapEl) return 0;
      var top = mapEl.getBoundingClientRect().top;
      var bottom = pill && pill.offsetParent ? pill.getBoundingClientRect().bottom : 0;
      return Math.max(0, Math.round(bottom - top));
    }

    /* Whole trip in view: the customer, the technician and the route. */
    function frameMap() {
      if (!map) return;
      var bounds = new G.LatLngBounds();
      var any = false;
      var pin = pinLatLng();
      if (pin) { bounds.extend(pin); any = true; }
      if (state.fix) { bounds.extend(latLng(state.fix.latitude, state.fix.longitude)); any = true; }
      (state.route || []).forEach(function (point) { bounds.extend(latLng(point[0], point[1])); any = true; });   /* the full route, driven part too */
      if (!any) return;
      /* the top padding also clears the pin and its label, which stand ~62px above the customer's point */
      map.fitBounds(bounds, { top: topOverlay() + 70, right: 50, bottom: 40, left: 50 });
      /* one point (or two very close ones) would zoom right in to the rooftops */
      G.event.addListenerOnce(map, 'idle', function () { if (map && map.getZoom() > FOLLOW_ZOOM) map.setZoom(FOLLOW_ZOOM); });
    }

    /* Centre on the technician, a little below the middle so the header and ETA pill do not cover them. */
    function followTech() {
      if (!map || !state.fix) return;
      var lat = Number(state.fix.latitude), lng = Number(state.fix.longitude);
      var zoom = map.getZoom() || FOLLOW_ZOOM;
      var metresPerPixel = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
      var shiftLat = (topOverlay() / 2) * metresPerPixel / 111320;
      map.panTo(latLng(lat + shiftLat, lng));
    }

    function refreshView() {
      if (follow) followTech(); else frameMap();
    }

    /* Follow mode is offered only while driving to the customer. byUser = the technician dragged the map: leave the view
       where they put it instead of re-framing it. */
    function setFollow(on, byUser) {
      follow = !!on && !!ARRIVAL_STAGES[state.stage];
      renderFollowButton();
      if (!map || byUser) return;
      if (follow) {
        if ((map.getZoom() || 0) < FOLLOW_ZOOM - 1) map.setZoom(FOLLOW_ZOOM);
        followTech();
      } else {
        frameMap();
      }
    }

    function buildFollowButton() {
      followButton = document.createElement('button');
      followButton.type = 'button';
      followButton.className = 'map-btn';
      followButton.addEventListener('click', function () { setFollow(!follow); });
      map.controls[G.ControlPosition.RIGHT_BOTTOM].push(followButton);
      renderFollowButton();
    }

    function renderFollowButton() {
      if (!followButton) return;
      followButton.style.display = ARRIVAL_STAGES[state.stage] ? '' : 'none';
      followButton.textContent = follow ? 'Overview' : 'Re-centre';
      followButton.setAttribute('aria-label', follow ? 'Show the whole route' : 'Centre the map on you');
    }

    /* Stage changed: follow while driving to the customer, otherwise frame the customer and technician together. */
    function syncFollowToStage() {
      var driving = !!ARRIVAL_STAGES[state.stage];
      if (driving === follow && map) { renderFollowButton(); return; }
      if (!driving) setFollow(false); else renderFollowButton();
    }

    /* Glide the marker to its new position instead of jumping; long jumps (a reload, a GPS hop) and hidden tabs snap. */
    function animateTech(target) {
      if (markerAnimation) { cancelAnimationFrame(markerAnimation); markerAnimation = null; }
      var from = techMarker.getPosition();
      var gap = haversineM({ latitude: from.lat(), longitude: from.lng() }, { latitude: target.lat(), longitude: target.lng() });
      if (gap > 300 || gap < 0.5 || document.hidden || typeof requestAnimationFrame !== 'function') {
        techMarker.setPosition(target);
        return;
      }
      var started = null;
      var duration = 800;
      function step(now) {
        if (!techMarker) return;
        if (started === null) started = now;
        var k = Math.min(1, (now - started) / duration);
        techMarker.setPosition(latLng(from.lat() + (target.lat() - from.lat()) * k, from.lng() + (target.lng() - from.lng()) * k));
        markerAnimation = k < 1 ? requestAnimationFrame(step) : null;
      }
      markerAnimation = requestAnimationFrame(step);
    }

    function moveTech() {
      if (!map || !state.fix) return;
      var at = latLng(state.fix.latitude, state.fix.longitude);
      if (!techMarker) {
        /* the centre of the round marker sits on the technician's position */
        techMarker = new HtmlMarker(at, TECH_HTML, 43, 40, 2, decorateTech);
        techMarker.setMap(map);
      } else {
        animateTech(at);
        techMarker.draw();
      }
      var accuracy = Number(state.fix.accuracy);
      if (isFinite(accuracy) && accuracy > 0) {
        if (!accuracyCircle) {
          accuracyCircle = new G.Circle({
            map: map, center: at, radius: accuracy, clickable: false,
            strokeColor: '#1a73e8', strokeOpacity: 0.35, strokeWeight: 1, fillColor: '#1a73e8', fillOpacity: 0.12
          });
        } else {
          accuracyCircle.setCenter(at);
          accuracyCircle.setRadius(accuracy);
        }
      }
      if (updateRouteProgress(state.fix)) trimRouteLine();   /* the road already driven turns grey */
      if (follow) followTech();
      ensureRoute();
    }

    /* Keep the map's bottom edge at the sheet's top edge, so nothing the technician needs (their marker, Google's
       logo and terms, the zoom and Re-centre buttons) ends up hidden behind the sheet. The open sheet covers the map
       anyway, so the map keeps its summary-height inset then. */
    function syncMapInset() {
      var mapEl = byId('map');
      if (!mapEl) return;
      var covered = sheetState === 'closed'
        ? (byId('sheet-grab').offsetHeight || HANDLE_FALLBACK_H)
        : Math.round(sheetHeight() - peekOffset());
      mapEl.style.bottom = Math.max(0, covered) + 'px';
      if (map && follow) setTimeout(followTech, 300);   /* after the resize has settled */
    }

    /* ---------------- heading, GPS health, wake lock ---------------- */

    function bearingDeg(a, b) {
      var rad = Math.PI / 180;
      var y = Math.sin((b.longitude - a.longitude) * rad) * Math.cos(b.latitude * rad);
      var x = Math.cos(a.latitude * rad) * Math.sin(b.latitude * rad) -
        Math.sin(a.latitude * rad) * Math.cos(b.latitude * rad) * Math.cos((b.longitude - a.longitude) * rad);
      return (Math.atan2(y, x) / rad + 360) % 360;
    }

    var headingFrom = null;   /* the fix the next bearing is measured from */

    /* Direction of travel: the GPS heading while actually moving, otherwise the bearing from the last point at least
       HEADING_MIN_MOVE_M away (so a parked phone's jitter does not spin the arrow). Unknown keeps the last value. */
    function noteFix(fix) {
      state.lastFixAt = Date.now();
      if (!fix || !isFinite(fix.latitude) || !isFinite(fix.longitude)) return;
      var gpsHeading = typeof fix.heading === 'number' && isFinite(fix.heading) &&
        typeof fix.speed === 'number' && isFinite(fix.speed) && fix.speed >= HEADING_MIN_SPEED_MS;
      if (gpsHeading) {
        state.heading = fix.heading;
        headingFrom = fix;
      } else if (!headingFrom) {
        headingFrom = fix;
      } else if (haversineM(headingFrom, fix) >= Math.max(HEADING_MIN_MOVE_M, (Number(fix.accuracy) || 0) * 0.5)) {
        state.heading = bearingDeg(headingFrom, fix);
        headingFrom = fix;
      }
      if (gpsLost) checkGps();
    }

    function agoText(ms) {
      var seconds = Math.round(ms / 1000);
      return seconds < 90 ? seconds + ' s ago' : Math.round(seconds / 60) + ' min ago';
    }

    /* No fix for GPS_LOST_MS while the location watch runs: say so on the map and fade the marker. */
    function checkGps() {
      var watching = state.watchId !== null || sim.on;
      var on = !demo && watching && !!DRIVING_STAGES[state.stage] && !document.hidden;
      var since = state.lastFixAt || state.watchStartedAt;
      var lost = on && since > 0 && Date.now() - since > GPS_LOST_MS;
      var pill = byId('gps-pill');
      if (pill) {
        pill.textContent = lost
          ? (state.lastFixAt ? 'GPS signal lost · last update ' + agoText(Date.now() - state.lastFixAt) : 'Waiting for GPS…')
          : '';
        pill.classList.toggle('hidden', !lost);
      }
      if (lost !== gpsLost) {
        gpsLost = lost;
        if (techMarker) techMarker.draw();
      }
      if (lost && !sim.on) restartWatch();   /* no fix for a while: the watch may be dead, subscribe again */
    }

    var wakeLock = null, wakeLockPending = false, tripShown = false;

    /* Keep the screen on while driving: a locked screen stops the browser's GPS and the location posts with it. */
    function syncWakeLock() {
      var want = !demo && tripShown && !!DRIVING_STAGES[state.stage] && !document.hidden && !destroyed;
      var supported = !!(navigator.wakeLock && typeof navigator.wakeLock.request === 'function');
      var hint = byId('screen-hint');
      if (hint) hint.classList.toggle('hidden', !(tripShown && !demo && DRIVING_STAGES[state.stage] && !supported));
      if (!supported) return;
      if (!want) {
        if (wakeLock) { var held = wakeLock; wakeLock = null; held.release().catch(noop); }
        return;
      }
      if (wakeLock || wakeLockPending) return;
      wakeLockPending = true;
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLockPending = false;
        wakeLock = lock;
        lock.addEventListener('release', function () { if (wakeLock === lock) wakeLock = null; });
        syncWakeLock();   /* things may have changed while the request was out: release again if not wanted */
      }).catch(function () { wakeLockPending = false; /* low battery mode etc.: nothing to do */ });
    }

    /* Back from another app or a locked screen: catch up at once instead of waiting for the next poll tick. */
    function resumeTracking() {
      if (demo || sim.on || destroyed || !DRIVING_STAGES[state.stage] || !state.pollTimer) return;
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
      positionFix().then(noop, noop).then(function () {
        if (destroyed) return null;
        moveTech();
        return sendLocation();
      }).then(function () {
        if (!destroyed && DRIVING_STAGES[state.stage] && !state.pollTimer && !sim.on) schedulePoll();
      });
    }

    function onVisibility() {
      syncWakeLock();
      checkGps();
      if (!document.hidden) {
        if (gpsLost || state.gpsError) restartWatch();
        resumeTracking();
      }
    }

    /* ---------------- route kept across reloads ---------------- */

    function routeKey() { return ROUTE_STORAGE_KEY + ':' + (jobToken || jobId || ''); }

    /* localStorage, not sessionStorage: re-opening the WhatsApp link opens a new tab, which must still find the route. */
    function saveRoute(polyline) {
      try {
        window.localStorage.setItem(routeKey(), JSON.stringify({ polyline: polyline, at: Date.now() }));
      } catch (error) { /* storage blocked: ensureRoute() fetches it again after a reload */ }
    }

    function loadRoute() {
      try {
        var raw = window.localStorage.getItem(routeKey());
        var saved = raw ? JSON.parse(raw) : null;
        if (!saved || typeof saved.polyline !== 'string') return '';
        if (Date.now() - (saved.at || 0) > ROUTE_MAX_AGE_MS) { window.localStorage.removeItem(routeKey()); return ''; }
        return saved.polyline;
      } catch (error) { return ''; }
    }

    /* No route while driving to the customer (Start-trip Routes call failed, storage empty or blocked, trip started
       before this page version): fetch one from the current position. Display only - start_journey has already gone,
       so it is not posted. Bounded: one request at a time, at most ROUTE_RETRY_MAX per page load, ROUTE_RETRY_MS apart. */
    var routeFetch = { busy: false, tries: 0, nextAt: 0 };

    function ensureRoute() {
      if (demo || destroyed || sim.on || !ARRIVAL_STAGES[state.stage]) return;
      if ((state.route && state.route.length >= 2) || routeFetch.busy || routeFetch.tries >= ROUTE_RETRY_MAX) return;
      if (!state.fix || Date.now() < routeFetch.nextAt) return;
      var pin = (state.detail && state.detail.customer_location) || null;
      if (!pin) return;
      routeFetch.busy = true;
      routeFetch.tries += 1;
      drawRoute(state.fix, pin).then(function (route) {
        routeFetch.busy = false;
        var points = route ? decodePolyline(route.route_polyline) : [];
        if (points.length < 2) { routeFetch.nextAt = Date.now() + ROUTE_RETRY_MS; return; }
        if (state.route && state.route.length >= 2) return;   /* another path got there first */
        state.route = points;
        state.routeAt = Date.now();
        saveRoute(route.route_polyline);
        drawRouteLine();
        if (!follow) frameMap();
      });
    }

    /* ---------------- copy address ---------------- */

    function copyAddress() {
      var address = ((state.detail && state.detail.customer_location) || {}).address;
      var button = byId('copy-address');
      if (!address || !button) return;
      function done(ok) {
        button.textContent = ok ? 'Copied' : 'Could not copy';
        setTimeout(function () { if (!destroyed && byId('copy-address')) byId('copy-address').textContent = 'Copy address'; }, 2000);
      }
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(address).then(function () { done(true); }, function () { done(legacyCopy(address)); });
      } else {
        done(legacyCopy(address));
      }
    }

    function legacyCopy(value) {
      var area = document.createElement('textarea');
      area.value = value;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (error) { ok = false; }
      document.body.removeChild(area);
      return ok;
    }

    /* ---------------- bottom sheet: grab handle, two resting heights ---------------- */

    var PEEK_OFFSET = 0.62;
    var HANDLE_FALLBACK_H = 44;           /* px of the closed strip when it cannot be measured */
    var sheet = byId('sheet');
    var dragStartY = null, dragStartOffset = null, dragCurrent = null, dragMoved = false;
    /* 'open' = full details, 'peek' = summary (default), 'closed' = only the labelled handle, so the map gets the screen. */
    var sheetState = 'peek';
    var sheetSummary = '';                /* the important detail shown in the closed handle: "4 min \u00b7 1.2 km away" */
    var sheetOpen = false;

    function sheetHeight() { return sheet.offsetHeight || window.innerHeight * 0.9; }
    function peekOffset() { return Math.round(sheetHeight() * PEEK_OFFSET); }
    function offsetFor(name) { return name === 'open' ? 0 : (name === 'closed' ? closedOffset() : peekOffset()); }
    function closedOffset() { return Math.round(sheetHeight() - (byId('sheet-grab').offsetHeight || HANDLE_FALLBACK_H)); }

    /* The handle always says what tapping it does. */
    function updateHandle() {
      var closed = sheetState === 'closed';
      var handle = byId('sheet-grab');
      handle.setAttribute('aria-label', closed ? 'Show trip details' : 'Hide trip details');
      handle.setAttribute('aria-expanded', closed ? 'false' : 'true');
      byId('grab-chev').innerHTML = closed ? '&#9652;' : '&#9662;';
      byId('grab-text').textContent = closed ? 'Show trip details' : 'Hide trip details';
      byId('grab-detail').textContent = closed ? sheetSummary : '';
    }

    function setSheetState(next) {
      sheetState = next;
      sheetOpen = next === 'open';
      sheet.classList.toggle('open', sheetOpen);
      sheet.classList.toggle('closed', next === 'closed');
      byId('view-trip').classList.toggle('sheet-closed', next === 'closed');   /* styling hook; the map inset itself is set by syncMapInset */
      var offset = next === 'open' ? 0 : (next === 'closed' ? closedOffset() : peekOffset());
      sheet.style.setProperty('--peek', offset + 'px');
      updateHandle();
      syncMapInset();
    }

    /* Existing callers: true = full details, false = the summary. */
    function setSheet(open) { setSheetState(open ? 'open' : 'peek'); }

    function currentOffset() {
      var transform = getComputedStyle(sheet).transform;
      if (!transform || transform === 'none') return 0;
      var match = transform.match(/matrix\(([^)]+)\)/);
      return match ? parseFloat(match[1].split(',')[5]) : 0;
    }

    function bindSheet() {
      var handle = byId('sheet-grab');
      var peek = byId('sheet-peek');

      function start(event) {
        var point = event.touches ? event.touches[0] : event;
        dragStartY = point.clientY;
        dragStartOffset = offsetFor(sheetState);
        dragCurrent = dragStartOffset;
        dragMoved = false;
        sheet.classList.add('dragging');
      }
      function move(event) {
        if (dragStartY === null) return;
        var point = event.touches ? event.touches[0] : event;
        var delta = point.clientY - dragStartY;
        if (Math.abs(delta) > 4) dragMoved = true;
        dragCurrent = Math.min(Math.max(dragStartOffset + delta, 0), closedOffset());
        sheet.style.setProperty('--peek', dragCurrent + 'px');
        if (event.cancelable) event.preventDefault();
      }
      function end() {
        if (dragStartY === null) return;
        var offset = dragCurrent !== null ? dragCurrent : offsetFor(sheetState);
        sheet.classList.remove('dragging');
        dragStartY = null;
        dragCurrent = null;
        if (!dragMoved) return;      /* a tap, not a drag: the click handlers below decide */
        /* snap to the nearest of the three resting positions */
        var targets = [['open', 0], ['peek', peekOffset()], ['closed', closedOffset()]];
        var best = targets[0];
        targets.forEach(function (target) { if (Math.abs(offset - target[1]) < Math.abs(offset - best[1])) best = target; });
        setSheetState(best[0]);
      }

      [handle, peek].forEach(function (element) {
        element.addEventListener('touchstart', start, { passive: true });
        element.addEventListener('touchmove', move, { passive: false });
        element.addEventListener('touchend', end);
        element.addEventListener('touchcancel', end);
        element.addEventListener('mousedown', start);
      });
      /* An open sheet can also be pulled down from its content: when the content is scrolled to the top, a downward
         swipe moves the sheet instead of scrolling. */
      var bodyEl = byId('sheet-body'), bodyY = null, bodyPull = false;
      bodyEl.addEventListener('touchstart', function (e) { bodyY = e.touches[0].clientY; bodyPull = false; }, { passive: true });
      bodyEl.addEventListener('touchmove', function (e) {
        if (bodyY === null) return;
        if (!bodyPull) {
          if (sheetState === 'open' && bodyEl.scrollTop <= 0 && e.touches[0].clientY - bodyY > 8) { bodyPull = true; start({ touches: [{ clientY: bodyY }] }); }
          else return;
        }
        move(e);
      }, { passive: false });
      function bodyEnd() { if (bodyPull) { bodyPull = false; end(); } bodyY = null; }
      bodyEl.addEventListener('touchend', bodyEnd);
      bodyEl.addEventListener('touchcancel', bodyEnd);
      addWindowListener('mousemove', move);
      addWindowListener('mouseup', end);
      /* tap the handle: hide the sheet down to the handle, or bring it back */
      handle.addEventListener('click', function () {
        if (dragMoved) { dragMoved = false; return; }
        setSheetState(sheetState === 'closed' ? 'peek' : 'closed');
      });
      /* tap the summary (not a button): full details, or back to the summary */
      peek.addEventListener('click', function (event) {
        if (dragMoved) { dragMoved = false; return; }
        if (event.target && event.target.closest && event.target.closest('button')) return;
        setSheetState(sheetState === 'open' ? 'peek' : 'open');
      });
      /* orientation change / resize: resting offsets are pixel values, so recompute them */
      addWindowListener('resize', function () { setSheetState(sheetState); });
      updateHandle();
    }

    /* ---------------- journey ---------------- */

    function showTrip() {
      byId('view-assigning').style.display = 'none';
      byId('view-trip').style.display = 'block';
      tripShown = true;
      /* decide follow before the map is built: building it in overview first leaves a pending fitBounds that lands after
         (and undoes) the follow zoom below */
      follow = !!ARRIVAL_STAGES[state.stage];
      buildMap();
      moveTech();
      setSheet(false);
      /* driving to the customer: follow the technician; any later stage: the customer and technician together */
      setFollow(!!ARRIVAL_STAGES[state.stage]);
      syncWakeLock();
    }

    function startTrip() {
      if (state.posting) return;
      if (!demo && state.permApi && state.permission !== 'granted') { renderLocationGate(); return; }
      if (demo) {
        state.fix = DEMO_FIX;
        state.route = DEMO_ROUTE;
        state.eta = 6;
        applyStage('on_the_way');
        showTrip();
        return;
      }
      state.posting = true;
      syncStartButton();
      setNotice('start-notice', 'Getting your location\u2026');

      positionFix().then(function (fix) {
        state.fix = fix;
        return drawRoute(fix, (state.detail || {}).customer_location).then(function (route) {
          var payload = {
            latitude: fix.latitude,
            longitude: fix.longitude,
            recorded_at: isoNow()
          };
          if (route) {
            payload.route_polyline = route.route_polyline;
            payload.route_distance_meters = route.route_distance_meters;
            payload.route_duration_minutes = route.route_duration_minutes;
            payload.route_computed_at = route.route_computed_at;
            state.route = decodePolyline(route.route_polyline);
            state.routeAt = Date.now();
            saveRoute(route.route_polyline);
          }
          return postJson(API + 'start_journey', payload);
        });
      }).then(function (result) {
        state.posting = false;
        arrivalBusy(false);
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status) {
          setNotice('start-notice', body.errorMessage || 'Could not start the trip. Try again.', true);
          return;
        }
        var data = body.data || {};
        state.eta = typeof data.eta_minutes === 'number' ? data.eta_minutes : null;
        if (data.next_interval_sec) state.interval = data.next_interval_sec;
        else if (state.detail && state.detail.location_interval_sec) state.interval = state.detail.location_interval_sec;
        applyStage(data.stage || 'on_the_way');
        setNotice('start-notice', null);
        showTrip();
        /* route_source is 'technician' or 'backend'; a rejected route never blocks the trip and the map keeps ours. */
        setNotice('trip-notice', data.route_accepted === false
          ? 'Your route could not be used, so the backend drew its own.' : null);
        watchPosition();
        state.lastPostAt = Date.now();
        schedulePoll();
      }).catch(function (error) {
        state.posting = false;
        syncStartButton();
        renderLocationGate();
        setNotice('start-notice', error && error.code === 1
          ? 'Location permission is needed to start the trip. Use the location banner at the top of this page to allow it.'
          : 'Could not start the trip. Check your connection and try again.', true);
      });
    }

    function watchPosition() {
      if (demo || sim.on) return;
      if (!navigator.geolocation || state.watchId !== null) return;
      state.watchStartedAt = Date.now();
      state.watchId = navigator.geolocation.watchPosition(function (position) {
        setFix({
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy,
          heading: position.coords.heading,   /* map arrow only; never posted */
          speed: position.coords.speed
        });
        state.gpsError = null;
        moveTech();
      }, function (error) {
        /* Location switched off, a timeout, or the permission withdrawn. Some phones never deliver another fix to this
           watch even after Location comes back, so drop it and subscribe again shortly (see restartWatch). */
        state.gpsError = (error && error.code) || 2;
        if (!gpsRetryTimer) gpsRetryTimer = setTimeout(function () { gpsRetryTimer = null; restartWatch(); }, GPS_RETRY_MS);
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    }

    /* Throw the location watch away and start a new one, plus a one-off read so a fix arrives as soon as the phone has
       one. Runs after a watch error, every GPS_RETRY_MS while the GPS reads as lost, when the page comes back to the
       front and when the location permission changes - so turning device Location off and on again recovers by itself.
       Throttled to one restart per GPS_RETRY_MS. */
    function restartWatch() {
      if (demo || destroyed || sim.on || !DRIVING_STAGES[state.stage] || !navigator.geolocation) return;
      if (Date.now() - lastWatchRestart < GPS_RETRY_MS) return;
      lastWatchRestart = Date.now();
      stopWatch();
      watchPosition();
      try {
        navigator.geolocation.getCurrentPosition(function (position) {
          if (destroyed || sim.on) return;
          setFix({ latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: position.coords.accuracy });
          moveTech();
        }, noop, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
      } catch (error) { /* the watch above is the main path */ }
    }

    function schedulePoll() {
      if (demo) return;
      if (sim.on) { simDrive(); return; }   /* Simulate drive: the virtual driver posts, not the real poll */
      var seconds = state.interval || 15;
      state.nextPostAt = Date.now() + seconds * 1000;
      state.pollTimer = setTimeout(function () { sendLocation().then(schedulePoll); }, seconds * 1000);
    }

    /* T3: positions only (max 20 points). The route is drawn once at Start (T2) and is never sent here. */
    function sendLocation() {
      if (!state.sendOn) return Promise.resolve();   /* toolbar checkbox off: no call, nothing queued */
      if (!DRIVING_STAGES[state.stage]) return Promise.resolve();
      if (!state.fix) return Promise.resolve();

      state.buffer.push({
        latitude: state.fix.latitude,
        longitude: state.fix.longitude,
        accuracy_m: Math.round(state.fix.accuracy || 0),
        recorded_at: isoNow()
      });
      if (state.buffer.length > 20) state.buffer = state.buffer.slice(-20);

      var payload = { points: state.buffer.slice(-20) };

      return postLocation(payload).then(function (data) {
        if (!data) return;
        state.buffer = [];
        state.lastPostAt = Date.now();
      }).catch(function () { /* buffered points go out on the next tick */ });
    }

    /* T3: one location post and its normal handling (link ended, stage moved on, ETA, interval). Used by the poll above
       and by the debug test tools. Resolves the response data on success, null otherwise; rejects on a network error. */
    function postLocation(payload) {
      return postJson(API + 'location', payload).then(function (result) {
        noteLocationPost(payload, result, null);
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return null; }
        var body = result.body || {};
        if (!result.ok || !body.status) return null;
        var data = body.data || {};
        if (data.accepted === false) { stopPolling(); applyStage(data.stage || state.stage); return null; }
        if (typeof data.eta_minutes === 'number') state.eta = data.eta_minutes;
        if (data.next_interval_sec) state.interval = data.next_interval_sec;
        if (data.stage) applyStage(data.stage);
        return data;
      }, function (error) {
        noteLocationPost(payload, null, error);
        throw error;
      });
    }

    function noteLocationPost(payload, result, error) {
      var points = (payload && payload.points) || [];
      state.lastLocPost = {
        at: Date.now(),
        point: points[points.length - 1] || null,
        status: result ? result.status : null,
        ok: !!(result && result.ok && result.body && result.body.status),
        error: error ? ((error && error.message) || 'network error') : null
      };
    }

    function stopWatch() {
      if (state.watchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(state.watchId);
        state.watchId = null;
      }
    }

    function stopPolling() {
      if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
      stopWatch();
      simHalt();
    }

    /* ================= Simulate drive (TESTING ONLY; everything is behind SHOW_TEST_SWITCH) =================
       The switch is in the page header. Turning it ON changes nothing about the trip - same starting position (the
       technician's real current location), same route, same customer, same location posts on the same interval - it
       only makes the pin move: the real GPS is set aside and a virtual technician drives along the existing route at
       SIM_SPEED_KMH from the route point nearest where the technician is, posting T3 (location) every
       location_interval_sec until it is within SIM_ARRIVE_M of the pin. Before Start trip, nothing moves yet: the
       technician taps Start trip as usual (T2 goes out from their real position) and the drive begins. A route is only
       drawn when none exists. It never calls T5 or anything after it. Turning it OFF mid-drive only PAUSES it (simPause):
       the pin stays put, that spot keeps being posted, and turning it ON again drives on from there. Before Start trip,
       OFF goes back to the real GPS and the normal location poll (simTurnOff); the trip is left as it is on the server. */

    function simKey() { return SIM_STORAGE_KEY + ':' + (jobToken || jobId || ''); }

    function simSave() {
      try {
        if (sim.on && sim.fix) {
          window.sessionStorage.setItem(simKey(), JSON.stringify({ on: true, paused: sim.paused, latitude: sim.fix.latitude, longitude: sim.fix.longitude }));
        } else {
          window.sessionStorage.removeItem(simKey());
        }
      } catch (error) { /* storage can be blocked: the switch just will not survive a reload */ }
    }

    function simLoad() {
      try {
        var raw = window.sessionStorage.getItem(simKey());
        return raw ? JSON.parse(raw) : null;
      } catch (error) { return null; }
    }

    function simPin() {
      var at = (state.detail && state.detail.customer_location) || {};
      if (at.latitude === null || at.latitude === undefined || at.latitude === '' ||
          at.longitude === null || at.longitude === undefined || at.longitude === '') return null;
      var lat = Number(at.latitude), lng = Number(at.longitude);
      return (isFinite(lat) && isFinite(lng)) ? { latitude: lat, longitude: lng } : null;
    }

    function simRender() {
      if (sim.toggle) sim.toggle.checked = sim.on && !sim.paused;
      renderSendSwitch();
    }

    function simHalt() {
      if (sim.timer) { clearInterval(sim.timer); sim.timer = null; }
    }

    /* Route as a list of [lat, lng] with cumulative metres, so the driver can be placed by distance. */
    function simSetRoute(points) {
      sim.pts = points;
      sim.cum = [0];
      for (var i = 1; i < points.length; i += 1) {
        sim.cum.push(sim.cum[i - 1] + haversineM(
          { latitude: points[i - 1][0], longitude: points[i - 1][1] },
          { latitude: points[i][0], longitude: points[i][1] }));
      }
      sim.total = sim.cum[sim.cum.length - 1] || 0;
      sim.dist = 0;
      sim.ready = points.length >= 2 && sim.total > 0;
    }

    /* Distance along the route of the point nearest `from` (a reload resumes from there, not from the route's start). */
    function simNearest(from) {
      var best = 0, bestD = Infinity, k = Math.cos(from.latitude * Math.PI / 180);
      var px = from.longitude * k, py = from.latitude;
      for (var i = 1; i < sim.pts.length; i += 1) {
        var ax = sim.pts[i - 1][1] * k, ay = sim.pts[i - 1][0], bx = sim.pts[i][1] * k, by = sim.pts[i][0];
        var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
        var t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
        t = Math.max(0, Math.min(1, t));
        var cx = ax + dx * t, cy = ay + dy * t;
        var d = (px - cx) * (px - cx) + (py - cy) * (py - cy);
        if (d < bestD) { bestD = d; best = sim.cum[i - 1] + (sim.cum[i] - sim.cum[i - 1]) * t; }
      }
      return best;
    }

    /* Interpolates between polyline vertices (no vertex-to-vertex jumps). */
    function simPointAt(distance) {
      var pts = sim.pts, cum = sim.cum;
      if (distance <= 0) return pts[0];
      if (distance >= sim.total) return pts[pts.length - 1];
      var i = 1;
      while (i < cum.length - 1 && cum[i] < distance) i += 1;
      var seg = cum[i] - cum[i - 1];
      var t = seg > 0 ? (distance - cum[i - 1]) / seg : 0;
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
    }

    /* The virtual technician is "the GPS": state.fix drives the page's own gate, distance and map marker. */
    function simSetPosition(lat, lng) {
      sim.fix = { latitude: lat, longitude: lng, accuracy: SIM_ACCURACY_M };
      state.fix = sim.fix;
      state.serverAway = null;
      noteFix(sim.fix);
      setPermission('granted');
      updateGate();
      moveTech();
      simSave();
    }

    function simDrawn(from, pin) {
      return drawRoute(from, pin).then(function (route) {
        return { route: route, pts: route ? decodePolyline(route.route_polyline) : [] };
      });
    }

    function simDrive() {
      if (!sim.on || sim.timer || sim.finished) return;
      if (!sim.ready && !simPrepareRoute()) return;
      sim.lastTick = Date.now();
      sim.lastPostAt = sim.reason === 'reopen' ? 0 : Date.now();   /* a reload posts at once, as "reopen" */
      sim.timer = setInterval(simTick, SIM_TICK_MS);
    }

    function simTick() {
      if (destroyed || !sim.on || !DRIVING_STAGES[state.stage]) { simHalt(); return; }
      var pin = simPin();
      if (!pin) { simHalt(); return; }
      var now = Date.now();
      var interval = (state.interval || 15) * 1000;
      var dt = Math.min(now - sim.lastTick, interval * 2);    /* a throttled background tab must not teleport */
      sim.lastTick = now;
      if (sim.paused) {
        /* Paused (switch unchecked mid-drive): the technician is standing still, e.g. stuck in traffic. The pin stays,
           the same spot keeps being posted on the interval with a fresh recorded_at, and the fix stays fresh. */
        simSetPosition(sim.fix.latitude, sim.fix.longitude);
      } else if (!sim.finishing) {
        sim.dist = Math.min(sim.total, sim.dist + (SIM_SPEED_KMH / 3.6) * (dt / 1000));   /* only ever forward */
        var at = simPointAt(sim.dist);
        simSetPosition(at[0], at[1]);
        if (haversineM(sim.fix, pin) <= SIM_ARRIVE_M || sim.dist >= sim.total) sim.finishing = true;
      }
      if (sim.finishing || now - sim.lastPostAt >= interval) simPost();
    }

    function simPost() {
      if (sim.busy || !sim.fix || !state.sendOn) return;   /* toolbar checkbox off: the drive goes on, nothing is posted */
      sim.busy = true;
      var run = sim.run;
      sim.pending.push({
        latitude: sim.fix.latitude,
        longitude: sim.fix.longitude,
        accuracy_m: SIM_ACCURACY_M,
        recorded_at: isoNow()
      });
      if (sim.pending.length > 20) sim.pending = sim.pending.slice(-20);
      sim.lastPostAt = Date.now();
      var simPayload = { points: sim.pending.slice(), reason: sim.reason };
      postJson(API + 'location', simPayload).then(function (result) {
        noteLocationPost(simPayload, result, null);
        sim.busy = false;
        if (!sim.on || sim.run !== run || destroyed) return;
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status) return;                 /* points stay pending and go out with the next post */
        var data = body.data || {};
        if (data.accepted === false) { simHalt(); sim.finished = true; applyStage(data.stage || state.stage); return; }
        sim.pending = [];
        sim.reason = 'stream';
        if (typeof data.eta_minutes === 'number') state.eta = data.eta_minutes;
        if (data.next_interval_sec) state.interval = data.next_interval_sec;
        if (data.stage && data.stage !== state.stage) applyStage(data.stage); else renderEta();
        if (sim.finishing) { simHalt(); sim.finished = true; }   /* the last point is in: stop the timer */
      }).catch(function (error) { noteLocationPost(simPayload, null, error); sim.busy = false; });
    }

    function simTurnOn(resume) {
      if (!SHOW_TEST_SWITCH || destroyed) return;
      if (sim.on && sim.paused) {           /* re-checked after a pause: drive on from where the pin stopped */
        sim.paused = false;
        sim.lastTick = Date.now();
        simSave();
        simRender();
        if (!sim.timer && DRIVING_STAGES[state.stage]) simDrive();
        return;
      }
      if (sim.on) return;
      var pin = simPin();
      var driving = !!DRIVING_STAGES[state.stage];
      var noticeId = state.stage === 'assigning' ? 'start-notice' : 'trip-notice';
      if (!state.detail || !pin) {
        simRender();
        setNotice(noticeId, 'Simulate drive needs the job and the customer location to be loaded.', true);
        return;
      }
      if (state.stage !== 'assigning' && !driving) {
        simRender();
        setNotice(noticeId, 'Simulate drive only works before the technician reaches the customer.', true);
        return;
      }
      sim.on = true;
      sim.run += 1;
      var run = sim.run;
      sim.ready = false; sim.finishing = false; sim.finished = false; sim.busy = false;
      sim.pending = []; sim.dist = 0; sim.pts = []; sim.cum = []; sim.total = 0;
      sim.paused = !!(resume && resume.paused);   /* a reload while paused stays paused at the saved spot */
      sim.reason = (resume && driving) ? 'reopen' : 'stream';
      /* real GPS out: no poll timer, no watch, and (via setFix / currentPosition) no real fixes */
      if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
      stopWatch();

      simRender();
      function alive() { return sim.on && sim.run === run && !destroyed; }

      /* Where the drive starts: after a reload mid-drive, the last simulated position; otherwise the technician's real
         current position (the latest fix, or one read now). SIM_START only when no position can be had at all. */
      var savedAt = (resume && isFinite(Number(resume.latitude)) && isFinite(Number(resume.longitude)))
        ? { latitude: Number(resume.latitude), longitude: Number(resume.longitude) } : null;
      var realAt = (state.fix && isFinite(state.fix.latitude) && isFinite(state.fix.longitude))
        ? { latitude: state.fix.latitude, longitude: state.fix.longitude } : null;
      if (savedAt || realAt) { go(savedAt || realAt); return; }
      setNotice(noticeId, 'Reading your location…');
      currentPosition().then(function (fix) {   /* sim.fix is still empty, so this is a real GPS read */
        if (alive()) { setNotice(noticeId, null); go({ latitude: fix.latitude, longitude: fix.longitude }); }
      }, function () {
        if (!alive()) return;
        setNotice(noticeId, 'Could not read your location, so the test drive starts from Sector 49, Gurgaon.', true);
        go({ latitude: SIM_START.latitude, longitude: SIM_START.longitude });
      });

      function go(startAt) {
        simSetPosition(startAt.latitude, startAt.longitude);   /* the marker stays where the technician is */

        if (!driving) {
          /* Stage "assigning": nothing moves yet. The technician taps Start trip as usual (T2 goes out from this position,
             with the route to the customer), and schedulePoll() then starts the drive (see simDrive). */
          setNotice('start-notice', 'Test drive is on. Tap Start trip and your pin will drive along the route.');
          return;
        }
        setNotice(noticeId, null);

        function line(from) { return [[from.latitude, from.longitude], [pin.latitude, pin.longitude]]; }
        /* Start driving along `pts` (a straight line when no road route could be had). */
        function begin(pts) {
          if (!alive()) return;
          var straight = !pts || pts.length < 2;
          if (straight) pts = line(startAt);   /* the virtual driver still moves, but a straight line is never drawn */
          simSetRoute(pts);
          sim.dist = simNearest(startAt);   /* start from the route point nearest the technician (or the last simulated spot) */
          if (!straight && (!state.route || state.route.length < 2)) {   /* a route drawn just now; the existing one stays as is */
            state.route = pts;
            drawRouteLine();
          }
          simDrive();
        }
        /* Already past Start (reload, or the trip was started earlier): no T2. Use a route we already have, in this order: the
           page's own, then the one saved at Start trip (or sent by the backend). A route is only drawn when there is none,
           because every Routes call is billed and a reload must not trigger one. */
        var have = (state.route && state.route.length >= 2) ? state.route.slice() : simSavedRoute();
        if (have.length >= 2) { begin(have); return; }   /* the same route: never replaced or extended */
        simDrawn(startAt, pin).then(function (drawn) { begin(drawn.pts); });
      }
    }

    /* The route saved at Start trip in this tab, or the one the backend put in the job payload ([] when there is none). */
    function simSavedRoute() {
      var kept = loadRoute() || (state.detail && typeof state.detail.route_polyline === 'string' ? state.detail.route_polyline : '');
      var pts = kept ? decodePolyline(kept) : [];
      return pts.length >= 2 ? pts : [];
    }

    /* A route that begins somewhere else gets the start point put in front, so the marker does not jump. */
    function simJoin(pts, startAt) {
      if (pts.length && haversineM(startAt, { latitude: pts[0][0], longitude: pts[0][1] }) > 50) pts.unshift([startAt.latitude, startAt.longitude]);
      return pts;
    }

    /* After Start trip: the page's route (drawn from the simulated position and sent in T2) becomes the drive path. */
    function simPrepareRoute() {
      var pin = simPin();
      if (!pin || !sim.fix) return false;
      var pts = (state.route && state.route.length >= 2) ? simJoin(state.route.slice(), sim.fix) : [];
      if (pts.length < 2) pts = [[sim.fix.latitude, sim.fix.longitude], [pin.latitude, pin.longitude]];
      simSetRoute(pts);
      return sim.ready;
    }

    /* Unchecking the switch mid-drive pauses: the pin stays where it is (the real GPS stays out) and re-checking drives
       on from that spot, like a technician who stopped in traffic. Before Start trip nothing has moved, so it turns off. */
    function simPause() {
      if (!sim.on || sim.paused) return;
      if (!DRIVING_STAGES[state.stage] || !sim.fix) { simTurnOff(); return; }
      sim.paused = true;
      simSave();
      simRender();
    }

    function simTurnOff() {
      if (!sim.on) return;
      sim.on = false;
      sim.paused = false;
      sim.run += 1;                      /* any request still in flight is ignored when it lands */
      simHalt();
      sim.ready = false; sim.fix = null; sim.pending = [];
      simSave();                         /* clears the stored switch state */
      simRender();
      if (destroyed) return;
      if (state.stage === 'assigning') setNotice('start-notice', null);
      /* Back to the real GPS and the normal location poll: the marker, arrival gate and posts follow the real position
         again from its next fix. The trip stays as it is on the server. */
      state.fix = null;
      state.serverAway = null;
      updateGate();
      watchPermission();
      askLocation();
      if (DRIVING_STAGES[state.stage]) {
        watchPosition();
        if (!state.pollTimer) schedulePoll();
        setNotice('trip-notice', null);
      }
    }

    function simResume() {
      if (!SHOW_TEST_SWITCH || demo || sim.on) return;
      var saved = simLoad();
      if (saved && saved.on) simTurnOn(saved);
    }

    /* The header is a fixed bar over both views. While the blocking location dialog is up, the header is lifted above it,
       otherwise the switch (the way past "no GPS") would be unreachable exactly when it is needed. */
    function simLiftHeader(up) {
      if (!SHOW_TEST_SWITCH || !sim.toggle) return;
      var header = root.querySelector('header');
      if (header) header.style.zIndex = up ? '1001' : '';
    }

    /* A checkbox pill in the toolbar (Test drive, Sending location). */
    function toolbarSwitch(id, area, label) {
      var box = document.createElement('label');
      box.className = 'tb-switch';
      box.style.gridArea = area;
      box.title = label;
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.id = id;
      input.setAttribute('aria-label', label);
      var text = document.createElement('span');
      box.appendChild(input);
      box.appendChild(text);
      root.querySelector('header').appendChild(box);
      injected.push(box);                 /* removed again on teardown */
      return { box: box, input: input, text: text };
    }

    function simBuildUi() {
      if (!SHOW_TEST_SWITCH || demo || !root.querySelector('header')) return;
      var ui = toolbarSwitch('sim-toggle', 'sim', 'Test: simulate drive');
      function setText() { ui.text.textContent = window.innerWidth >= 640 ? 'Test: simulate drive' : 'Test drive'; }
      addWindowListener('resize', setText);
      setText();
      sim.toggle = ui.input;
      ui.input.addEventListener('change', function () { if (ui.input.checked) simTurnOn(null); else simPause(); });
    }

    /* ---------------- "Sending location in Xs" (toolbar) ---------------- */

    var sendUi = null, sendTimer = null;

    /* Seconds to the next location post, or null when no post is scheduled (not driving, or not polling). */
    function secondsToNextPost() {
      if (demo || !DRIVING_STAGES[state.stage]) return null;
      var next = 0;
      if (sim.on) {
        if (!sim.timer) return null;
        next = sim.lastPostAt + (state.interval || 15) * 1000;
      } else {
        if (!state.pollTimer) return null;
        next = state.nextPostAt;
      }
      return Math.max(0, Math.ceil((next - Date.now()) / 1000));
    }

    function renderSendSwitch() {
      if (!sendUi) return;
      sendUi.input.checked = state.sendOn;
      var wide = window.innerWidth >= 430;   /* narrower: short labels, so the job status keeps its room in the toolbar */
      var secs = state.sendOn ? secondsToNextPost() : null;
      var label;
      if (!state.sendOn) label = wide ? 'Location sending off' : 'Loc off';
      else if (secs === null) label = wide ? 'Sending location' : 'Loc on';
      else label = (wide ? 'Sending location in ' : 'Loc ') + secs + 's';
      sendUi.text.textContent = label;
      sendUi.box.classList.toggle('off', !state.sendOn);
    }

    /* Restart the real poll with an immediate post of the latest fix (no wait for a fresh GPS read). */
    function postLocationNow() {
      if (demo || sim.on || destroyed || !DRIVING_STAGES[state.stage] || !state.pollTimer) return;
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
      state.nextPostAt = Date.now();
      sendLocation().then(function () {
        if (!destroyed && DRIVING_STAGES[state.stage] && !state.pollTimer && !sim.on) schedulePoll();
      });
    }

    function sendBuildUi() {
      if (!SHOW_SEND_SWITCH || demo || !root.querySelector('header')) return;
      sendUi = toolbarSwitch('send-toggle', 'send', 'Send my location');
      sendUi.input.checked = true;
      sendUi.input.addEventListener('change', function () {
        state.sendOn = sendUi.input.checked;
        if (state.sendOn) {
          /* switched back on: send now rather than waiting out the rest of the interval */
          if (sim.on) sim.lastPostAt = 0; else postLocationNow();
        }
        renderSendSwitch();
      });
      addWindowListener('resize', renderSendSwitch);
      sendTimer = setInterval(renderSendSwitch, 1000);
      renderSendSwitch();
    }

    /* ---------------- T5: arrival OTP ---------------- */

    function submitOtp() {
      if (state.otpBusy) return;
      var input = byId('otp-input');
      var otp = (input.value || '').replace(/\D/g, '');
      if (otp.length !== 4) {
        setNotice('otp-notice', 'Enter the 4-digit OTP the customer sees in their app.', true);
        return;
      }
      state.otpBusy = true;
      var button = byId('otp-submit');
      button.disabled = true;
      setNotice('otp-notice', 'Checking the OTP\u2026');

      positionFix().then(function (fix) {
        state.fix = fix;
        return postJson(API + 'verify_otp', {
          otp: otp,
          latitude: fix.latitude,
          longitude: fix.longitude,
          recorded_at: isoNow()
        });
      }).then(function (result) {
        state.otpBusy = false;
        button.disabled = false;
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (result.ok && body.status) {
          input.value = '';
          setNotice('otp-notice', null);
          state.buffer = [];
          applyStage((body.data || {}).stage || 'working');
          return;
        }
        var data = body.data || {};
        if (body.error === 'otp_incorrect') {
          input.value = '';
          input.focus();
          /* the attempts left are not shown (nor the backend's message, which may carry them) */
          setNotice('otp-notice', 'Wrong OTP. Check with the customer and try again.', true);
          return;
        }
        if (body.error === 'otp_attempts_exceeded' || result.status === 429) {
          setNotice('otp-notice', 'Too many wrong attempts. Support has been alerted \u2014 call them to restart the visit.', true);
          return;
        }
        if (body.error === 'too_far_from_customer') {
          var away = data.distance_m;
          lockFromServer(away);
          setNotice('otp-notice', 'You look ' + (away ? formatDistance(away) : 'too far') +
            ' from the customer. Move closer to the car and enter the OTP again.', true);
          return;
        }
        var moved = syncStage(body);
        if (moved) { setNotice('otp-notice', moved, true); return; }
        setNotice('otp-notice', body.errorMessage || 'Could not verify the OTP. Try again.', true);
      }).catch(function (error) {
        state.otpBusy = false;
        button.disabled = false;
        setNotice('otp-notice', error && error.code === 1
          ? 'Location permission is needed to confirm you are at the car. Allow it for this page and try again.'
          : 'Could not verify the OTP. Check your connection and try again.', true);
      });
    }

    /* ---------------- T4: I have reached ---------------- */

    function arrivalBusy(busy) {
      byId('reached').disabled = busy;
      byId('peek-reached').disabled = busy;
    }

    function markReached() {
      if (state.posting) return;
      state.posting = true;
      arrivalBusy(true);
      setNotice('arrive-notice', 'Checking you are at the customer\u2026');

      /* One clean fix at the pin: a high-accuracy watch competing for the GPS is what makes this tap slow. */
      stopWatch();
      positionFix().then(function (fix) {
        state.fix = fix;
        return postJson(API + 'reached', {
          latitude: fix.latitude,
          longitude: fix.longitude,
          recorded_at: isoNow()
        });
      }).then(function (result) {
        state.posting = false;
        arrivalBusy(false);
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (result.ok && body.status) {
          setNotice('arrive-notice', null);
          applyStage((body.data || {}).stage || 'reached');
          return;
        }
        watchPosition();                                   /* still driving: keep the map live */
        if (body.error === 'too_far_from_customer') {
          var away = ((body.data || {}).distance_m);
          lockFromServer(away);
          setNotice('arrive-notice', 'You look ' + (away ? formatDistance(away) : 'too far') +
            ' from the customer. Move closer and tap again.', true);
          return;
        }
        var moved = syncStage(body);
        if (moved) { setNotice('arrive-notice', moved, true); return; }
        setNotice('arrive-notice', body.errorMessage || 'Could not record your arrival. Try again.', true);
      }).catch(function (error) {
        state.posting = false;
        arrivalBusy(false);
        watchPosition();
        setNotice('arrive-notice', error && error.code === 1
          ? 'Location permission is needed to confirm you are at the car. Allow it for this page and try again.'
          : 'Could not record your arrival. Check your connection and try again.', true);
      });
    }

    /* ---------------- T6: live car photos, the closing action ---------------- */

    function renderShots() {
      var wrap = byId('shots');
      var uploaded = state.photos.length;
      var total = state.minPhotos || 4;
      wrap.innerHTML = '';
      for (var i = 0; i < total; i += 1) {
        var tile = document.createElement('div');
        var shot = state.photos[i];
        tile.className = 'shot' + (shot ? ' done' : '');
        if (shot && shot.url) {
          var img = document.createElement('img');
          img.src = shot.url;
          img.alt = 'Photo ' + (i + 1);
          tile.appendChild(img);
          tile.title = 'Tap to retake';
          (function (index) {
            tile.addEventListener('click', function () { retakePhoto(index); });
          }(i));
        } else if (shot) {
          tile.textContent = '\u2713';
        } else {
          /* an empty tile works like the Take photo button: it opens the camera for the next photo (they fill in order) */
          tile.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">' +
            '<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
          tile.className += ' empty';
          tile.setAttribute('role', 'button');
          tile.setAttribute('tabindex', '0');
          tile.setAttribute('aria-label', 'Take photo ' + (uploaded + 1) + ' of ' + total);
          tile.addEventListener('click', takePhoto);
          tile.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); takePhoto(); }
          });
        }
        wrap.appendChild(tile);
      }
      var button = byId('take-photo');
      button.textContent = uploaded >= total ? 'All photos taken' : 'Take photo ' + (uploaded + 1) + ' of ' + total;
      button.disabled = uploaded >= total;
      var line = (uploaded + ' of ' + total + ' photos');
      text('photo-count', line);
      text('trip-photo-count', line);
      var complete = byId('complete');
      complete.classList.toggle('hidden', !(uploaded >= total && state.stage === 'working'));
      if (uploaded >= total) text('photos-copy', 'All photos uploaded. Tap Complete job to close it.');
    }

    /* ---- Live camera: photos must be taken at that moment, so the normal path is an in-page getUserMedia sheet, not
       a file chooser (which lets the technician pick an old gallery picture). The stream is local to this page and the
       frame goes through uploadPhoto() like before. #camera (file input) is only the fallback when getUserMedia is
       unavailable (and in demo mode, which never touches the camera). */
    var camera = { stream: null, token: 0, open: false, capturing: false };
    var CAMERA_NO_API_COPY = 'This browser cannot open the camera here. Allow camera access, or reload and try again.';
    var CAMERA_BLOCKED_COPY = 'Camera access is blocked. Allow the camera for this page in your browser\'s site settings, then try again.';
    var CAMERA_NONE_COPY = 'No camera was found on this device.';
    var CAMERA_BUSY_COPY = 'The camera could not be started. Close other apps using it, then try again.';

    function cameraSupported() {
      return !!(navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function');
    }

    /* Stop every track of a stream; used for the live stream and for one that arrives after the sheet was closed. */
    function stopStream(stream) {
      if (!stream) return;
      stream.getTracks().forEach(function (track) { try { track.stop(); } catch (error) { /* already ended */ } });
    }

    /* Close the sheet for any reason (shot taken, cancel, error, teardown, page hidden). Bumping the token makes a
       getUserMedia() that is still pending stop its stream when it resolves instead of attaching it. */
    function closeCamera() {
      camera.token += 1;
      camera.open = false;
      camera.capturing = false;
      var stream = camera.stream;
      camera.stream = null;
      stopStream(stream);
      var video = byId('camera-preview');
      if (video) { try { video.pause(); } catch (error) { /* ignore */ } video.srcObject = null; }
      var shutter = byId('camera-shutter');
      if (shutter) shutter.disabled = true;
      if (byId('camera-sheet')) hide('camera-sheet');
    }

    /* Close the sheet and report why in the photos notice (the sheet itself has no room for a message). */
    function cameraFailed(message) {
      closeCamera();
      setNotice('photos-notice', message, true);
    }

    function cameraErrorCopy(error) {
      var name = error && error.name;
      if (name === 'NotAllowedError' || name === 'SecurityError') return CAMERA_BLOCKED_COPY;
      if (name === 'NotFoundError' || name === 'OverconstrainedError' || name === 'DevicesNotFoundError') return CAMERA_NONE_COPY;
      return CAMERA_BUSY_COPY;
    }

    /* Rear camera at 720p when possible; a missing or over-constrained camera gets one retry with plain video. */
    function requestCameraStream() {
      var devices = navigator.mediaDevices;
      return devices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      }).catch(function (error) {
        var name = error && error.name;
        if (name === 'NotFoundError' || name === 'OverconstrainedError') return devices.getUserMedia({ video: true });
        throw error;
      });
    }

    function openCamera() {
      camera.token += 1;
      var token = camera.token;
      camera.open = true;
      byId('camera-shutter').disabled = true;
      show('camera-status');
      show('camera-sheet');
      var video = byId('camera-preview');

      function frameReady() {
        if (token !== camera.token || !video.videoWidth) return;
        hide('camera-status');
        byId('camera-shutter').disabled = false;
      }

      requestCameraStream().then(function (stream) {
        if (destroyed || token !== camera.token) { stopStream(stream); return; }
        camera.stream = stream;
        video.onloadedmetadata = frameReady;
        video.srcObject = stream;
        var playing = video.play();
        if (playing && typeof playing.then === 'function') playing.then(frameReady, noop);
      }).catch(function (error) {
        if (destroyed || token !== camera.token) return;
        cameraFailed(cameraErrorCopy(error));
      });
    }

    /* Shutter: freeze the current frame at the video's intrinsic size and send it as a JPEG through uploadPhoto(). */
    function capturePhoto() {
      var video = byId('camera-preview');
      if (!camera.open || !camera.stream || camera.capturing || !video.videoWidth) return;
      camera.capturing = true;
      byId('camera-shutter').disabled = true;
      var token = camera.token;
      var canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) {
        if (destroyed || token !== camera.token) return;
        if (!blob) { cameraFailed('Could not capture the photo. Try again.'); return; }
        var file = new File([blob], 'photo-' + Date.now() + '.jpg', { type: 'image/jpeg' });
        closeCamera();
        uploadPhoto(file);
      }, 'image/jpeg', 0.85);
    }

    function takePhoto() {
      if (!PHOTO_STAGES[state.stage]) return;
      if (state.photoBusy || state.photos.length >= state.minPhotos || camera.open) return;
      setNotice('photos-notice', null);
      if (demo) { byId('camera').click(); return; }
      if (!cameraSupported()) {
        setNotice('photos-notice', CAMERA_NO_API_COPY, true);
        byId('camera').click();
        return;
      }
      openCamera();
    }

    /* Blocking "Uploading photo" dialog. It goes up at the start of uploadPhoto() (so it is already on screen when the
       camera sheet closes) and comes down on every exit path; hideUploadProgress() is idempotent. No close button,
       backdrop and Escape do nothing. Body scroll is locked like the location gate: capture on show, restore on hide. */
    function showUploadProgress() {
      var overlay = byId('upload-progress');
      if (!overlay) return;
      var sub = byId('upload-progress-sub');
      if (state.minPhotos) {
        sub.textContent = 'Photo ' + (state.photos.length + 1) + ' of ' + state.minPhotos;
        sub.classList.remove('hidden');
      } else {
        sub.textContent = '';
        sub.classList.add('hidden');
      }
      overlay.classList.remove('hidden');
      if (progressOverflow === null) {
        progressOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
      }
    }

    function hideUploadProgress() {
      var overlay = byId('upload-progress');
      if (overlay) overlay.classList.add('hidden');
      if (progressOverflow !== null) {
        document.body.style.overflow = progressOverflow;
        progressOverflow = null;
      }
    }

    function uploadPhoto(file) {
      if (!file || state.photoBusy) return;
      state.photoBusy = true;
      byId('take-photo').disabled = true;
      showUploadProgress();
      setNotice('photos-notice', 'Uploading photo ' + (state.photos.length + 1) + '\u2026');

      positionFix().then(function (fix) {
        state.fix = fix;
        var form = new FormData();
        form.append('photo', file, file.name || 'photo.jpg');
        form.append('captured_at', isoNow());
        form.append('latitude', fix.latitude);
        form.append('longitude', fix.longitude);
        return postForm(UPLOAD_API + 'photos', form);
      }).then(function (result) {
        state.photoBusy = false;
        hideUploadProgress();
        byId('take-photo').disabled = false;
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status) {
          var movedStage = syncStage(body);
          if (movedStage) { setNotice('photos-notice', movedStage, true); return; }
          setNotice('photos-notice', body.errorMessage || 'Could not upload the photo. Try again.', true);
          return;
        }
        var data = body.data || {};
        var url = (window.URL && window.URL.createObjectURL) ? window.URL.createObjectURL(file) : '';
        if (url) objectUrls.push(url);
        state.photos.push({ photo_id: data.photo_id, url: url });
        if (data.min_required) state.minPhotos = data.min_required;
        setNotice('photos-notice', null);
        renderShots();
        if (data.completed || data.stage === 'completed') applyStage('completed');
      }).catch(function () {
        state.photoBusy = false;
        hideUploadProgress();
        byId('take-photo').disabled = false;
        setNotice('photos-notice', 'Could not upload the photo. Check your connection and try again.', true);
      });
    }

    /* T7: the job closes once the required photos are in. A backend that closes the job on the last photo answers
       the upload with `completed`, and then this button never appears. */
    function completeJob() {
      if (state.posting || state.photoBusy) return;
      state.posting = true;
      var button = byId('complete');
      button.disabled = true;
      setNotice('photos-notice', 'Completing the job\u2026');
      postJson(API + 'complete', {}).then(function (result) {
        state.posting = false;
        arrivalBusy(false);
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (result.ok && body.status) {
          setNotice('photos-notice', null);
          applyStage((body.data || {}).stage || 'completed');
          return;
        }
        if (body.error === 'photos_missing') {
          var data = body.data || {};
          if (data.min_required) state.minPhotos = data.min_required;
          renderShots();
          setNotice('photos-notice', 'Upload all ' + (data.min_required || state.minPhotos) +
            ' photos before completing the job.', true);
          return;
        }
        var moved = syncStage(body);
        if (moved) { setNotice('photos-notice', moved, true); return; }
        setNotice('photos-notice', body.errorMessage || 'Could not complete the job. Try again.', true);
      }).catch(function () {
        state.posting = false;
        button.disabled = false;
        setNotice('photos-notice', 'Could not complete the job. Check your connection and try again.', true);
      });
    }

    /* Retake: allowed only while the job is still working (never after it has completed). */
    function retakePhoto(index) {
      var shot = state.photos[index];
      if (!shot || !shot.photo_id || state.photoBusy || state.stage !== 'working') return;
      if (destroyed) return;
      state.photoBusy = true;
      fetch(API + 'photos/' + encodeURIComponent(shot.photo_id), {
        method: 'DELETE',
        headers: authHeaders({ 'Accept': 'application/json' }),
        credentials: 'same-origin'
      }).then(readJson).then(function (result) {
        state.photoBusy = false;
        var body = result.body || {};
        if (!result.ok || !body.status) {
          setNotice('photos-notice', body.errorMessage || 'Could not remove that photo.', true);
          return;
        }
        state.photos.splice(index, 1);
        setNotice('photos-notice', null);
        renderShots();
      }).catch(function () {
        state.photoBusy = false;
        setNotice('photos-notice', 'Could not remove that photo. Try again.', true);
      });
    }

    function stopCameraWhenHidden() { if (document.hidden) closeCamera(); }

    function startPage() {
      if (!demo && !jobToken && !jobId) {
        showError('Use the link WhatsApp sent you, or ask the ops team for a fresh link.');
        return;
      }
  
      byId('start-trip').addEventListener('click', startTrip);
      byId('allow-location').addEventListener('click', askLocation);
      byId('reload-page').addEventListener('click', function () { window.location.reload(); });
      byId('otp-submit').addEventListener('click', submitOtp);
      byId('otp-input').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') submitOtp();
      });
      byId('reached').addEventListener('click', markReached);
      byId('peek-reached').addEventListener('click', markReached);
      byId('complete').addEventListener('click', completeJob);
      byId('take-photo').addEventListener('click', takePhoto);
      byId('camera-shutter').addEventListener('click', capturePhoto);
      byId('camera-cancel').addEventListener('click', closeCamera);
      byId('camera').addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        event.target.value = '';
        uploadPhoto(file);
      });
      byId('copy-address').addEventListener('click', copyAddress);
      bindSheet();
      /* safety stop: a camera must never stay on once the page is hidden or leaves */
      document.addEventListener('visibilitychange', stopCameraWhenHidden);
      addWindowListener('pagehide', closeCamera);
      /* wake lock, GPS health and an immediate catch-up post when the page comes back to the front */
      document.addEventListener('visibilitychange', onVisibility);
      if (!demo) gpsTimer = setInterval(checkGps, 5000);
      if (!G && !demo) {
        setNotice('trip-notice', mapsKey
          ? 'The map could not be loaded. The trip, arrival and location sharing still work.'
          : 'The map is not set up for this page. The trip, arrival and location sharing still work.', true);
      }
  
      if (demo) {
        state.detail = JSON.parse(JSON.stringify(DEMO_DETAIL));
        if (demoMock === 'bad-car') {
          var badCar = JSON.parse(JSON.stringify(DEMO_BAD_CAR));
          state.detail.car = badCar.car;
          state.detail.services = badCar.services;
          state.detail.customer = badCar.customer;
        }
        renderDetails(state.detail);
        applyStage('assigning');
        hide('loading');
        show('assigning-body');
        if (demoStage === 'trip') {
          state.fix = DEMO_FIX;
          state.route = DEMO_ROUTE;
          state.eta = 6;
          applyStage('on_the_way');
          showTrip();
        }
        return;
      }

      /* Ask for location now, alongside the job fetch (also on a mid-trip reload), so the technician has already
         answered by the time they reach Start Trip. Neither call can block rendering or fail the fetch below. */
      watchPermission();
      renderLocationGate();
      askLocation();

      var jobUrl = API + 'job' +(jobId && !jobToken ? '?job_id=' + encodeURIComponent(jobId) : '');
      getJson(jobUrl).then(function (result) {
        var end = endOfLink(result.body, result.status);
        if (end) { failLink(end); return; }
        var body = result.body || {};
        if (!result.ok || !body.status || !body.data) {
          showError(body.errorMessage || 'Ask the ops team for a fresh link.');
          return;
        }
        state.detail = body.data;
        state.interval = state.detail.location_interval_sec || 15;
        renderDetails(state.detail);
        applyStage(state.detail.stage || 'assigning');
        hide('loading');
        simResume();   /* Simulate drive: restore the switch after a reload (no-op unless it was on) */
        if ((state.detail.stage || 'assigning') === 'assigning') {
          show('assigning-body');
          return;
        }
        // Reloaded mid-trip (or the job moved on): go straight back to the map and let the location poll rebuild the
        // ETA instead of offering Start Trip again. The route comes back from storage (or the job payload, if the
        // backend sends it); only when neither has it does ensureRoute() fetch one from the first fix.
        if (DRIVING_STAGES[state.stage] && (!state.route || state.route.length < 2)) {
          var keptRoute = loadRoute() || (typeof state.detail.route_polyline === 'string' ? state.detail.route_polyline : '');
          var keptPoints = keptRoute ? decodePolyline(keptRoute) : [];
          /* drawn at once; the first position then trims it to the part still ahead (moveTech -> updateRouteProgress) */
          if (keptPoints.length >= 2) state.route = keptPoints;
        }
        showTrip();
        if (DRIVING_STAGES[state.stage]) { watchPosition(); schedulePoll(); }
        if (state.stage === 'working' || state.stage === 'completed') setSheet(true);
      }).catch(function () {
        showError('Could not load the job. Check your connection and reload.');
      });
    }

    /* ---------------- TEST TOOLS loader (DEBUG ONLY, NOT FOR PRODUCTION) ----------------
       Only called when TEST_TOOLS_ENABLED. The module is a separate file (a webpack chunk on the website, docs/testTools.js
       in the standalone build), so a production page never downloads it. It gets the page's own functions below and
       changes nothing about the API contract. */
    var testToolsDispose = null;

    function loadTestTools() {
      import(/* webpackChunkName: 'rsaTestTools' */ './testTools.js').then(function (mod) {
        if (destroyed) return;
        testToolsDispose = mod.default(testToolsApi());
      }).catch(function (error) { if (window.console) window.console.warn('Test tools could not load', error); });
    }

    function routePointAt(points, cum, distance) {
      if (distance <= 0) return points[0];
      if (distance >= cum[cum.length - 1]) return points[points.length - 1];
      var i = 1;
      while (i < cum.length - 1 && cum[i] < distance) i += 1;
      var seg = cum[i] - cum[i - 1];
      var t = seg > 0 ? (distance - cum[i - 1]) / seg : 0;
      return [points[i - 1][0] + (points[i][0] - points[i - 1][0]) * t, points[i - 1][1] + (points[i][1] - points[i - 1][1]) * t];
    }

    function testToolsApi() {
      return {
        root: root, state: state, sim: sim, API: API, postJson: postJson, arriveRadius: ARRIVE_RADIUS_M,
        postLocation: postLocation,
        startTrip: startTrip,
        markReached: markReached,
        completeJob: completeJob,
        stageLabel: function () { return (STAGE_LABELS[state.stage] || '-') + ' [' + (state.stage || '-') + ']'; },
        isPolling: function () { return sim.on ? !!sim.timer : !!state.pollTimer; },
        gpsState: function () {
          if (sim.on) return 'simulated (Test drive)';
          if (state.permission === 'denied' || state.gpsError === 1) return 'permission denied';
          if (gpsLost) return 'lost';
          if (state.gpsError) return 'error (code ' + state.gpsError + ')';
          if (!state.fix) return 'waiting for a fix';
          return 'ok (\u00b1' + Math.round(state.fix.accuracy || 0) + ' m)';
        },
        routeProgress: function () {
          if (sim.on && sim.total > 0) return { pct: 100 * sim.dist / sim.total, source: 'Test drive' };
          if (!state.route || state.route.length < 2) return null;
          var g = routeGeometry(), total = g.cum[g.cum.length - 1];
          return { pct: total > 0 ? 100 * g.along / total : 0, source: 'real GPS' };
        },
        routeLength: function (points) {
          var m = 0;
          for (var i = 1; i < points.length; i += 1) {
            m += haversineM({ latitude: points[i - 1][0], longitude: points[i - 1][1] }, { latitude: points[i][0], longitude: points[i][1] });
          }
          return m;
        },
        /* Move to a fraction of the route. With Test drive on, the virtual technician moves there and drives on;
           otherwise only the point is returned (the caller posts it once, the real GPS carries on). */
        jumpTo: function (fraction) {
          if (sim.on && sim.ready && sim.total > 0) {
            sim.dist = fraction * sim.total;
            sim.finishing = false; sim.finished = false;
            var at = simPointAt(sim.dist);
            routeGeo = null;              /* re-match from the start, so a jump backwards un-greys the route */
            simSetPosition(at[0], at[1]);
            drawRouteLine();
            if (!sim.timer && DRIVING_STAGES[state.stage]) simDrive();
            return { point: { latitude: at[0], longitude: at[1], accuracy_m: SIM_ACCURACY_M }, simulated: true };
          }
          if (!state.route || state.route.length < 2) return null;
          var g = routeGeometry();
          var p = routePointAt(state.route, g.cum, fraction * g.cum[g.cum.length - 1]);
          return { point: { latitude: p[0], longitude: p[1], accuracy_m: Math.round((state.fix && state.fix.accuracy) || 10) }, simulated: false };
        },
        verifyOtp: function (otp) { byId('otp-input').value = otp; submitOtp(); },
        /* The real uploadPhoto() with a generated JPEG instead of a camera frame. */
        uploadTestPhoto: function () {
          var canvas = document.createElement('canvas');
          canvas.width = 960; canvas.height = 720;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#7b2cbf'; ctx.fillRect(0, 0, 960, 720);
          ctx.fillStyle = '#fff'; ctx.font = 'bold 64px sans-serif';
          ctx.fillText('TEST PHOTO', 60, 330);
          ctx.font = '32px sans-serif';
          ctx.fillText('Debug test tools \u00b7 ' + new Date().toISOString(), 60, 400);
          canvas.toBlob(function (blob) {
            if (!blob || destroyed) return;
            uploadPhoto(new File([blob], 'test-photo-' + Date.now() + '.jpg', { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.8);
        },
        rerouteBlocked: function () { return (!state.route || state.route.length < 3) ? 'No route on the map yet.' : ''; },
        /* Use a new route locally after the backend took it. */
        useRoute: function (points, polyline) {
          state.route = points;
          routeGeo = null;
          saveRoute(polyline);
          drawRouteLine();
          if (sim.on && sim.fix) { simSetRoute(points); sim.dist = simNearest(sim.fix); }
        }
      };
    }

    /* ---------------- Google Maps JavaScript API (first boot only) ---------------- */

    /* Load the Maps JavaScript API once, then start the page. A missing key, a blocked script or a slow network never
       blocks the job: after MAPS_LOAD_TIMEOUT_MS (or on error) the page starts without a map. */
    function withGoogleMaps(done) {
      var finished = false;
      function settle() {
        if (finished || destroyed) return;
        finished = true;
        G = (window.google && window.google.maps && window.google.maps.Map) ? window.google.maps : null;
        done();
      }
      /* Google calls this when the key is rejected (wrong key, API not enabled, referrer not allowed). */
      window.gm_authFailure = function () {
        if (destroyed) return;
        setNotice('trip-notice', 'The map could not be loaded (map key rejected). The trip, arrival and location sharing still work.', true);
        if (typeof previousAuthFailure === 'function') previousAuthFailure();
      };
      if (window.google && window.google.maps && window.google.maps.Map) { settle(); return; }
      if (!mapsKey) { settle(); return; }
      var timer = setTimeout(settle, MAPS_LOAD_TIMEOUT_MS);
      window[MAPS_CALLBACK] = function () { clearTimeout(timer); settle(); };
      var script = document.createElement('script');
      script.src = GOOGLE_MAPS_JS + '?key=' + encodeURIComponent(mapsKey) + '&v=weekly&callback=' + MAPS_CALLBACK;
      script.async = true;
      script.onerror = function () { clearTimeout(timer); settle(); };
      injected.push(script);
      document.head.appendChild(script);
    }

    sendBuildUi();  /* "Sending location in Xs" checkbox (renders nothing when SHOW_SEND_SWITCH is false) */
    simBuildUi();   /* Simulate drive switch (testing only; renders nothing when SHOW_TEST_SWITCH is false) */
    withGoogleMaps(startPage);
    if (TEST_TOOLS_ENABLED) loadTestTools();   /* DEBUG ONLY: never true on a production host */

    return function teardown() {
      if (destroyed) return;
      destroyed = true;
      closeCamera();
      document.removeEventListener('visibilitychange', stopCameraWhenHidden);
      document.removeEventListener('visibilitychange', onVisibility);
      if (gpsTimer) { clearInterval(gpsTimer); gpsTimer = null; }
      if (gpsRetryTimer) { clearTimeout(gpsRetryTimer); gpsRetryTimer = null; }
      if (testToolsDispose) { testToolsDispose(); testToolsDispose = null; }
      if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
      if (wakeLock) { var held = wakeLock; wakeLock = null; held.release().catch(noop); }
      if (markerAnimation) { cancelAnimationFrame(markerAnimation); markerAnimation = null; }
      window.gm_authFailure = previousAuthFailure;
      try { delete window[MAPS_CALLBACK]; } catch (error) { window[MAPS_CALLBACK] = undefined; }
      if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
      stopWatch();
      simHalt();
      if (permissionStatus) { permissionStatus.onchange = null; permissionStatus = null; }
      windowListeners.forEach(function (entry) { window.removeEventListener(entry[0], entry[1]); });
      windowListeners = [];
      if (headerObserver) { headerObserver.disconnect(); headerObserver = null; }
      if (map) {
        try {
          mapListeners.forEach(function (listener) { listener.remove(); });
          clearRouteLines();
          [techMarker, pinMarker, accuracyCircle, trafficLayer].forEach(function (item) { if (item) item.setMap(null); });
          G.event.clearInstanceListeners(map);
        } catch (error) { /* already gone */ }
        mapListeners = []; map = null; techMarker = null; pinMarker = null; accuracyCircle = null; trafficLayer = null;
        followButton = null;
      }
      objectUrls.forEach(function (url) { try { window.URL.revokeObjectURL(url); } catch (error) { /* ignore */ } });
      objectUrls = [];
      injected.forEach(function (node) { if (node.parentNode) node.parentNode.removeChild(node); });
      injected = [];
      /* Fresh markup also drops every element listener bound by startPage(). */
      root.innerHTML = initialMarkup;
      document.body.style.overflow = previousOverflow;
      started = false;
    };
}

/* Standalone entry: replaces the website's React route (index.js / RsaTechnicianJob.js).
   Everything the page needs comes from the URL or from window.RSA_CONFIG (see config.json):

     ?job=<jobToken>          the technician link token (also accepted: ?token=)
     &api=<url>               main API base, e.g. https://abc.ngrok-free.app/api/
     &upload_api=<url>        photo-upload API base (defaults to &api=)
     &maps_key=<key>          Google Maps browser key (Maps JavaScript API); without it there is no map
     &routes_key=<key>        Routes API key for the Start-trip route (defaults to &maps_key=)
     &ngrok=0                 do not add the ngrok-skip-browser-warning header
     ?demo=1                  boot.js demo mode: no API calls, sample data

   `markup`, `css` and `boot` are defined above this block by build.js. */

var cfg = window.RSA_CONFIG || {};
var query = new URLSearchParams(window.location.search);
var allowQuery = cfg.allowQueryApi !== false;

function pick(name, fallback) {
  var fromUrl = allowQuery ? (query.get(name) || '').trim() : '';
  return fromUrl || String(fallback || '').trim();
}

var jobToken = (query.get('job') || query.get('token') || cfg.jobToken || '').trim();
var apiBase = pick('api', cfg.apiBase);
var uploadApiBase = pick('upload_api', cfg.uploadApiBase) || apiBase;
var googleMapsKey = pick('maps_key', cfg.googleMapsKey);
var googleRoutesKey = pick('routes_key', cfg.googleRoutesKey);
var isDemo = query.get('demo') === '1';

/* ngrok's free tier answers browser requests with an HTML warning page unless this header is present.
   Added only for ngrok hosts. NOTE: the backend's CORS must list `ngrok-skip-browser-warning` in
   Access-Control-Allow-Headers, otherwise the browser blocks the call; use &ngrok=0 to turn this off. */
var ngrokHeader = query.get('ngrok') !== '0' && cfg.ngrokSkipWarning !== false;
var nativeFetch = window.fetch.bind(window);
window.fetch = function (url, init) {
  try {
    var target = typeof url === 'string' ? url : (url && url.url) || '';
    if (ngrokHeader && /ngrok/i.test(target)) {
      init = Object.assign({}, init);
      init.headers = Object.assign({}, init.headers, { 'ngrok-skip-browser-warning': '1' });
    }
  } catch (error) { /* fall through to a plain fetch */ }
  return nativeFetch(url, init);
};

function showSetupProblem(message) {
  var root = document.getElementById('rsa-job');
  root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:520px;margin:48px auto;padding:20px;' +
    'border:1px solid #f5c2c7;background:#fff5f5;color:#842029;border-radius:10px;line-height:1.5">' +
    '<strong>Page not set up</strong><br>' + message + '</div>';
}

function start() {
  var style = document.createElement('style');
  style.textContent = css;
  document.head.appendChild(style);

  var root = document.getElementById('rsa-job');
  if (!isDemo && !apiBase) {
    showSetupProblem('No API address. Open this page as <code>?job=&lt;token&gt;&amp;api=https://your-api-host/api/</code> ' +
      'or set <code>apiBase</code> in config.json and rebuild.');
    return;
  }
  if (!isDemo && !jobToken) {
    showSetupProblem('No job token. Open this page as <code>?job=&lt;token&gt;&amp;api=...</code>.');
    return;
  }
  root.innerHTML = markup;
  boot({ jobToken: jobToken, apiBase: apiBase, uploadApiBase: uploadApiBase, googleMapsKey: googleMapsKey, googleRoutesKey: googleRoutesKey });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();

})();
</script>
</body>
</html>
